:root {
  /* Layout idea: a clubhouse leaderboard panel sitting on scorecard paper. Ruled rows, numbered like holes, square boxes you tick per set. */
  --paper: #F1F4EC;
  --card: #FBFCF7;
  --ink: #14221A;
  --muted: #58695E;
  --rule: #CAD5C6;
  --board: #153D2A;
  --board-ink: #F4F7EF;
  --board-rule: rgba(244, 247, 239, .3);
  --green: #1C6A42;
  --on-green: #FFFFFF;
  --flag: #F2C230;
  --flag-ink: #241D03;
  --red: #B23220;
  --desk: #E3E8DD;
  --display: 'League Gothic', 'DIN Condensed', 'Avenir Next Condensed', 'Arial Narrow', Impact, sans-serif;
  --body: 'Libre Franklin', 'Franklin Gothic Medium', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C130F; --card: #131D17; --ink: #E6EDE4; --muted: #9AAD9F; --rule: #2A3A2F;
    --board: #1A4A33; --board-ink: #F4F7EF; --board-rule: rgba(244, 247, 239, .28);
    --green: #6DCB96; --on-green: #0C130F; --flag: #F2C230; --flag-ink: #241D03; --red: #F0907E; --desk: #070B09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C130F; --card: #131D17; --ink: #E6EDE4; --muted: #9AAD9F; --rule: #2A3A2F;
  --board: #1A4A33; --board-ink: #F4F7EF; --board-rule: rgba(244, 247, 239, .28);
  --green: #6DCB96; --on-green: #0C130F; --flag: #F2C230; --flag-ink: #241D03; --red: #F0907E; --desk: #070B09;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--desk); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none; margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--green); }

#app {
  height: 100%; max-width: 480px; margin: 0 auto; position: relative;
  display: flex; flex-direction: column; background: var(--paper);
  box-shadow: 0 0 0 1px var(--rule);
}
#view {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 18px;
}
#view:focus { outline: none; }
/* Full-screen on a phone: a green band sits under the status bar, and the bottom edge clears the home indicator. */
#app::before { content: ""; flex: none; height: env(safe-area-inset-top, 0px); background: var(--board); }
#view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overscroll-behavior: contain; }
#app[data-chrome="none"] #view { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
#app[data-chrome="none"] #timer.on { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
#view > * { flex-shrink: 0; }

/* ---------- type ---------- */
.disp { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .02em; line-height: .95; }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top .brand { font-size: 26px; }
.top .date { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.title { font-size: 44px; text-wrap: balance; }

/* ---------- week strip ---------- */
.week { display: flex; flex-direction: column; gap: 8px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; }
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--rule); background: var(--card); border-radius: 4px; overflow: hidden; }
.week-row > div { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 8px; border-left: 1px solid var(--rule); min-height: 62px; }
.week-row > div:first-child { border-left: 0; }
.week-row .dow { font: 600 10px/1 var(--body); letter-spacing: .1em; color: var(--muted); }
.week-row .dn { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); line-height: 1; }
.week-row .is-today { background: color-mix(in srgb, var(--flag) 22%, transparent); }
.week-row .is-today .dn, .week-row .is-today .dow { color: var(--ink); font-weight: 700; }

/* letter marks for workout types */
.mark {
  width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font: 400 16px/1 var(--display); background: var(--green); color: var(--on-green); padding-top: 1px;
}
.mark.m { background: transparent; color: var(--green); box-shadow: inset 0 0 0 2px var(--green); }
.mark.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.mark.due { background: transparent; box-shadow: inset 0 0 0 2px var(--flag); color: var(--ink); }

/* ---------- leaderboard panel ---------- */
.board {
  background: var(--board); color: var(--board-ink); border-radius: 6px; position: relative;
  padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px;
}
.board::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--board-rule); border-radius: 3px; pointer-events: none; }
.board > * { position: relative; }
.board-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.board .eyebrow { color: var(--flag); }
.pill { font: 700 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px 5px; border-radius: 2px; background: var(--flag); color: var(--flag-ink); white-space: nowrap; }
.pill.ghost { background: transparent; color: var(--board-ink); box-shadow: inset 0 0 0 1px var(--board-rule); }
.board h1 { font: 400 clamp(54px, 17vw, 76px)/.9 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.board .sub { font-size: 15px; opacity: .88; max-width: 34ch; }
.cells { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--board-rule); }
.cells > div { padding: 8px 10px 7px; border-left: 1px solid var(--board-rule); display: flex; flex-direction: column; gap: 3px; }
.cells > div:first-child { border-left: 0; }
.cells dt { font: 600 10px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .72; }
.cells dd { font: 400 32px/1 var(--display); font-variant-numeric: tabular-nums; }
.cells dd small { font: 500 12px var(--body); margin-left: 4px; opacity: .8; }
.board .note { font-size: 13.5px; opacity: .9; }
.rot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rot ol { display: flex; gap: 0; }
.rot li { width: 46px; text-align: center; border: 1px solid var(--board-rule); border-left-width: 0; padding: 5px 0 4px; display: flex; flex-direction: column; gap: 2px; }
.rot li:first-child { border-left-width: 1px; }
.rot li b { font: 400 24px/1 var(--display); }
.rot li i { font: 600 8.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; font-style: normal; opacity: .75; }
.rot li.was { opacity: .6; }
.rot li.was b { text-decoration: line-through; text-decoration-thickness: 2px; }
.rot li.next { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
.rot li.next i { opacity: 1; }

/* ---------- buttons ---------- */
.btn { display: block; width: 100%; padding: 15px 16px; border-radius: 4px; border: 0; font: 700 16px/1.2 var(--body); text-align: center; text-decoration: none; }
.btn.flag { background: var(--flag); color: var(--flag-ink); }
.btn.solid { background: var(--green); color: var(--on-green); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.quiet { background: transparent; color: var(--green); padding: 10px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.link { background: none; border: 0; padding: 6px 0; color: var(--green); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* ---------- paper cards and scorecard rows ---------- */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 13px 14px 9px; }
.card-head h2 { font: 400 26px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.card-head span { font-size: 13px; color: var(--muted); }
.card-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.blk-head { font: 600 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 7px 14px 6px; background: var(--paper); border-block: 1px solid var(--rule); }
.rows > li { display: grid; grid-template-columns: 38px 1fr auto; align-items: stretch; border-top: 1px solid var(--rule); }
.rows > li:first-child { border-top: 0; }
.rows .n { display: grid; place-items: center; font: 400 22px/1 var(--display); color: var(--muted); border-right: 1px solid var(--rule); font-variant-numeric: tabular-nums; padding-top: 2px; }
.rows .nm { padding: 10px 12px; font-weight: 600; font-size: 15px; line-height: 1.25; min-width: 0; }
.rows .nm small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rows .rx { padding: 10px 12px 10px 0; font-size: 13.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; align-self: center; white-space: nowrap; }
.tag { display: inline-block; font: 700 9.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 3px 4px 2px; border-radius: 2px; background: color-mix(in srgb, var(--flag) 45%, transparent); color: var(--ink); vertical-align: 2px; margin-left: 6px; }

/* notices */
.notice { border: 1px solid var(--rule); border-left: 4px solid var(--flag); background: var(--card); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.notice p { font-size: 14.5px; }
.notice strong { font-weight: 700; }

/* ---------- session ---------- */
.ses-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ses-top button { background: none; border: 0; padding: 8px 0; font-weight: 600; font-size: 14px; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.clock { font: 400 26px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 8px; background: var(--rule); border-radius: 1px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); transition: width .25s ease; }
.rows.live > li { grid-template-columns: 38px 1fr auto; }
.rows.live .row-main { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; }
.rows.live .nm { display: block; }
.rows.live .boxes { display: flex; gap: 6px; padding: 8px 10px 8px 0; align-items: center; }
.box {
  width: 36px; height: 36px; border: 1.5px solid var(--muted); border-radius: 2px; background: transparent;
  display: grid; place-items: center; font: 400 18px/1 var(--display); color: var(--muted); padding: 2px 0 0;
}
.box.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.rows.live li.done .nm { color: var(--muted); }
.rows.live li.done .n { color: var(--green); }
.rows.live li.open { background: color-mix(in srgb, var(--flag) 10%, transparent); }
.detail { grid-column: 1 / -1; border-top: 1px dashed var(--rule); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; }
.detail .lab { font: 700 10.5px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.chip-btn { background: transparent; border: 0; box-shadow: inset 0 0 0 1.5px var(--green); color: var(--green); font-weight: 600; font-size: 13.5px; padding: 9px 12px; border-radius: 3px; text-decoration: none; display: inline-block; line-height: 1.2; }

/* timer */
#timer { display: none; background: var(--board); color: var(--board-ink); padding: 10px 16px 12px; }
#timer.on { display: block; }
#timer .t-row { display: flex; align-items: center; gap: 12px; }
#timer .t-lab { font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--flag); width: 44px; }
#timer .t-num { font: 400 40px/1 var(--display); font-variant-numeric: tabular-nums; flex: 1; letter-spacing: .03em; }
#timer button { background: transparent; border: 0; box-shadow: inset 0 0 0 1px var(--board-rule); color: var(--board-ink); font-weight: 600; font-size: 14px; padding: 10px 12px; border-radius: 3px; }
#timer .bar { background: var(--board-rule); margin-top: 8px; height: 4px; }
#timer .bar > i { background: var(--flag); transition: none; }

/* ---------- tabs ---------- */
#tabs { display: flex; border-top: 1px solid var(--rule); background: var(--card); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs[hidden] { display: none; }
#tabs button { flex: 1; background: none; border: 0; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 10.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#tabs button[aria-current="page"] { color: var(--green); }
#tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- history ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); background: var(--card); border-radius: 4px; }
.stats > div { padding: 10px 12px 9px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.stats > div:first-child { border-left: 0; }
.stats dt { font: 600 10px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stats dd { font: 400 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats dd small { font: 500 13px var(--body); color: var(--muted); margin-left: 3px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 6px 14px; }
.cal-nav h2 { font: 400 26px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.cal-nav button { background: none; border: 0; width: 44px; height: 40px; font-size: 22px; color: var(--green); border-radius: 3px; }
.cal-nav button[disabled] { opacity: .3; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--rule); }
.cal .dow { font: 600 10px/1 var(--body); letter-spacing: .1em; color: var(--muted); text-align: center; padding: 7px 0 6px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.cal .day { min-height: 52px; border-bottom: 1px solid var(--rule); border-left: 1px solid var(--rule); padding: 4px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); background: none; border-top: 0; border-right: 0; border-radius: 0; }
.cal .day:nth-child(7n + 1) { border-left: 0; }
.cal .day.out { background: var(--paper); }
.cal .day.today { color: var(--ink); font-weight: 700; background: color-mix(in srgb, var(--flag) 22%, transparent); }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.cal .marks { display: flex; gap: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px 12px; font-size: 12.5px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .mark { width: 20px; height: 20px; font-size: 13px; }
.entries > li { border-top: 1px solid var(--rule); }
.entries > li:first-child { border-top: 0; }
.entry-main { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px; }
.entry-main b { display: block; font-weight: 600; font-size: 15px; }
.entry-main small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.entry-main .chev { color: var(--muted); font-size: 13px; }
.entry-detail { padding: 0 14px 14px 50px; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 4px 14px 16px; font-size: 14.5px; color: var(--muted); }

/* ---------- plan and settings ---------- */
.facts { display: flex; flex-direction: column; }
.facts li { padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 14.5px; display: grid; grid-template-columns: 96px 1fr; gap: 10px; }
.facts li b { font: 600 11px/1.5 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.types li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--rule); align-items: start; }
.types b { display: block; font-size: 15px; }
.types small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.field { padding: 12px 14px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .flab { font: 600 11px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; border-left: 1.5px solid var(--ink); padding: 11px 4px; font-weight: 600; font-size: 14px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: transparent; border: 0; box-shadow: inset 0 0 0 1.5px var(--muted); padding: 9px 12px; border-radius: 3px; font-size: 14px; font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--green); color: var(--on-green); box-shadow: none; font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--ink); border-radius: 3px; width: max-content; overflow: hidden; }
.stepper button { width: 48px; height: 46px; background: transparent; border: 0; font-size: 22px; font-weight: 600; }
.stepper input { width: 76px; height: 46px; text-align: center; border: 0; border-inline: 1.5px solid var(--ink); background: transparent; font: 400 30px/1 var(--display); font-variant-numeric: tabular-nums; border-radius: 0; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sync { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-1px); }
.sync.ok i { background: var(--green); }
.sync.err i { background: var(--red); }
.fine { font-size: 12.5px; color: var(--muted); }

/* ---------- first-launch check ---------- */
.ob { flex: 1 0 auto; display: flex; flex-direction: column; gap: 18px; }
.ob-nav { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.holes { display: grid; grid-template-columns: repeat(9, 1fr); border: 1px solid var(--rule); background: var(--card); }
.holes span { text-align: center; font: 400 17px/1 var(--display); padding: 6px 0 4px; border-left: 1px solid var(--rule); color: var(--muted); font-variant-numeric: tabular-nums; }
.holes span:first-child { border-left: 0; }
.holes span.done { background: var(--green); color: var(--on-green); border-color: var(--green); }
.holes span.now { background: var(--flag); color: var(--flag-ink); }
.ob h1 { font: 400 44px/.95 var(--display); text-transform: uppercase; letter-spacing: .015em; text-wrap: balance; }
.ob .help { font-size: 15px; color: var(--muted); max-width: 46ch; }
.opts { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); overflow: hidden; }
.opts button { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 15px 14px; font-size: 16px; font-weight: 500; }
.opts button:first-child { border-top: 0; }
.opts button .tick { width: 26px; height: 26px; border: 1.5px solid var(--muted); border-radius: 2px; display: grid; place-items: center; font: 400 17px/1 var(--display); color: transparent; padding-top: 2px; }
.opts button[aria-pressed="true"] { background: color-mix(in srgb, var(--flag) 16%, transparent); font-weight: 600; }
.opts button[aria-pressed="true"] .tick { background: var(--green); border-color: var(--green); color: var(--on-green); }
.push { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.welcome { flex: 1 0 auto; display: flex; flex-direction: column; gap: 18px; }
.welcome .board h1 { font-size: clamp(64px, 21vw, 92px); }
.steps3 li { display: grid; grid-template-columns: 38px 1fr; border-top: 1px solid var(--rule); }
.steps3 li:first-child { border-top: 0; }
.steps3 .n { display: grid; place-items: center; font: 400 22px/1 var(--display); color: var(--muted); border-right: 1px solid var(--rule); padding-top: 2px; }
.steps3 p { padding: 11px 12px; font-size: 14.5px; }
.steps3 b { font-weight: 600; }
.scoregrid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--board-rule); }
.scoregrid > div { padding: 8px 8px 7px; border-left: 1px solid var(--board-rule); display: flex; flex-direction: column; gap: 3px; }
.scoregrid > div:first-child { border-left: 0; }
.scoregrid dt { font: 600 9.5px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .72; }
.scoregrid dd { font: 400 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.scoregrid dd small { font: 500 12px var(--body); opacity: .75; }

/* ---------- sheets ---------- */
#sheet { position: absolute; inset: 0; display: none; align-items: flex-end; background: rgba(8, 14, 10, .55); z-index: 5; }
#sheet.on { display: flex; }
.sheet:focus { outline: none; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--paper); border-top: 4px solid var(--green); border-radius: 10px 10px 0 0; padding: 20px 16px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { font: 400 38px/.95 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.sheet p { font-size: 15px; }
.feel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.feel button { background: var(--card); border: 0; box-shadow: inset 0 0 0 1.5px var(--rule); padding: 12px 6px 11px; border-radius: 4px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.feel button b { font: 400 24px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.feel button small { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.25; }
.feel button[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--green); background: color-mix(in srgb, var(--green) 10%, var(--card)); }
.date-in { width: 100%; padding: 12px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--card); font-size: 16px; min-height: 48px; }
.code-in { width: 100%; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--card); color: var(--ink); font: 16px/1.35 ui-monospace, Menlo, Consolas, monospace; resize: vertical; word-break: break-all; }
.stamp-wrap { display: flex; justify-content: center; padding: 10px 0 2px; }
.stamp { font: 400 62px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--red); border: 4px solid var(--red); border-radius: 6px; padding: 8px 18px 2px; transform: rotate(-6deg); animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.1); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.pick li { border-top: 1px solid var(--rule); }
.pick li:first-child { border-top: 0; }
.pick button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; }
.pick b { display: block; font-size: 15.5px; }
.pick small { display: block; font-size: 13px; color: var(--muted); }

.splash { flex: 1 0 auto; display: grid; place-items: center; }

@media (prefers-reduced-motion: reduce) {
  .stamp { animation: none; }
  .bar > i { transition: none; }
  .btn:active { transform: none; }
}

<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <div id="timer" role="timer">
    <div class="t-row">
      <span class="t-lab" id="t-lab">Rest</span>
      <span class="t-num" id="t-num">0:00</span>
      <button type="button" data-act="t-add">+15 s</button>
      <button type="button" data-act="t-skip">Skip</button>
    </div>
    <div class="bar"><i id="t-bar"></i></div>
  </div>
  <nav id="tabs" aria-label="Sections" hidden>
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V4"/><path d="M7 4.5l11 3.5-11 4"/><path d="M4 21h6"/></svg>Today</button>
    <button type="button" data-tab="record"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path d="M8.5 14.8l2 2 4-4"/></svg>Record</button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V2.8h6V4M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/></svg>Plan</button>
  </nav>
  <div id="sheet"></div>
</div>
<script>
/* Exercise library and workout templates.
   Row: [id, name, equipment, minLevel, maxLevel, mode, flags, how, why]
   equipment: '' (bodyweight, golf club, chair, wall) | band | db | mb | bench | gym
   mode: r = reps, s = reps each side, t = timed hold, ts = timed hold each side
   flags: k = loads knees, b = loads lower back, s = loads shoulders, i = impact (jumping) */
const LIB = [];
function addPool(pool, rows) {
  rows.forEach(function (r) {
    LIB.push({ id: r[0], name: r[1], pool: pool, eq: r[2], lo: r[3], hi: r[4], mode: r[5], fl: r[6], how: r[7], why: r[8], idx: LIB.length });
  });
}

/* ---------- Mobility: hips ---------- */
addPool('hip', [
  ['hip9090', '90/90 hip switches', '', 1, 3, 's', 'k', 'Sit with both knees bent to 90°, one shin in front and one out to the side. Stay tall and rotate both knees over to the other side. Lean on your hands if you need to.', 'Hip rotation lets you load your trail hip and clear your lead hip without swaying.'],
  ['wgs', "World's greatest stretch", '', 2, 3, 's', 'k', 'Step into a long lunge with both hands inside the front foot. Drop the inside elbow toward the floor, then rotate that arm to the ceiling. Step back and switch sides.', 'Opens hips, hamstrings and upper back together, the same chain a full turn uses.'],
  ['leg_swings', 'Leg swings', '', 1, 3, 's', '', 'Hold a wall or a club for balance. Swing one leg forward and back, then across your body and out. Stay tall and let the swing grow gradually.', 'Warms the hips through the ranges your backswing and follow-through need.'],
  ['adductor_rock', 'Adductor rock-backs', '', 1, 3, 's', 'k', 'On hands and knees, straighten one leg out to the side with the foot flat. Rock your hips back toward your heel, then return.', 'Inner-thigh mobility supports a wide, stable stance and a clean weight shift.'],
  ['hip_cars', 'Standing hip circles', '', 1, 3, 's', '', 'Hold a wall. Lift one knee to hip height, open it out to the side, turn the foot behind you and lower. Make the biggest slow circle you can control, then reverse.', 'Controlled hip rotation is the engine of the swing, trained here with no floor work.'],
  ['squat_pry', 'Deep squat hold', '', 2, 3, 't', 'k', 'Sink into a deep squat with elbows inside your knees and chest up. Gently press the knees out and shift side to side. Hold a door frame if you need support.', 'Restores the hip and ankle range that keeps your posture through the swing.'],
  ['cossack', 'Cossack shifts', '', 2, 3, 's', 'k', 'Take a wide stance. Sit down over one heel while the other leg stays straight with toes up. Push back to the middle and shift to the other side.', 'Trains side-to-side hip mobility for loading and posting up on each leg.']
]);

/* ---------- Mobility: upper back ---------- */
addPool('tsp', [
  ['open_book', 'Open book', '', 1, 3, 's', '', 'Lie on your side with knees bent and stacked, arms straight in front. Sweep the top arm up and over to the floor behind you and follow it with your eyes. Keep the knees together.', 'Your shoulder turn should come from the upper back, not the lower back.'],
  ['thread_needle', 'Thread the needle', '', 1, 3, 's', '', 'On hands and knees, slide one arm under your body until that shoulder rests near the floor. Then sweep the same arm up to the ceiling.', 'Frees upper-back rotation both ways for a fuller backswing and finish.'],
  ['quad_rot', 'Kneeling upper-back rotation', '', 1, 3, 's', '', 'On hands and knees, sit back slightly and put one hand behind your head. Bring that elbow toward the opposite wrist, then rotate it up to the ceiling.', 'Isolates upper-back turn while your hips stay still, like a good backswing.'],
  ['club_turns', 'Golf-posture turns', '', 1, 3, 's', '', 'Hold a club across your shoulders and set up in golf posture. Turn back until your lead shoulder sits over your trail foot, then turn through to a full finish.', 'Rehearses separating shoulders from hips, where stored power comes from.'],
  ['cat_cow', 'Cat-cow', '', 1, 3, 'r', '', 'On hands and knees, round your whole spine up toward the ceiling, then let your chest sink and tailbone lift. Move slowly, one breath per rep.', 'Gets every segment of the spine moving before you ask it to rotate.'],
  ['seated_rot', 'Seated club rotation', '', 1, 3, 's', '', 'Sit tall on a chair with a club across your chest and feet planted. Rotate your shoulders as far as you can each way without your knees moving.', 'Sitting locks the hips, so the turn has to come from your upper back.']
]);

/* ---------- Mobility: shoulders ---------- */
addPool('shd', [
  ['wall_angels', 'Wall angels', '', 1, 3, 'r', '', 'Stand with back, head and arms against a wall, elbows bent 90°. Slide your arms up overhead and back down, keeping contact with the wall.', 'Opens the chest and shoulders so you can keep width and posture at the top.'],
  ['band_apart', 'Band pull-aparts', 'band', 1, 3, 'r', '', 'Hold a band at chest height with straight arms. Pull it apart until it touches your chest, squeezing your shoulder blades. Return slowly.', 'Wakes up the upper back that holds your posture over the ball.'],
  ['shoulder_cars', 'Slow arm circles', '', 1, 3, 's', '', 'Stand tall. Draw the biggest, slowest circle you can with one straight arm, turning the palm as it passes behind you. Keep your ribs still.', 'Maintains the shoulder rotation you need at the top and through release.'],
  ['pass_through', 'Club pass-throughs', '', 1, 3, 'r', 's', 'Hold a club with a very wide grip and straight arms. Raise it overhead and as far behind you as is comfortable, then bring it back.', 'Loosens the tight shoulders and chest that shorten a backswing.'],
  ['scap_pushup', 'Shoulder-blade push-ups', '', 1, 3, 'r', '', 'On hands and knees or in a plank, keep your elbows straight. Let your chest sink between the shoulder blades, then push the floor away.', 'Stable shoulder blades give your arms a solid base to swing from.']
]);

/* ---------- Activation ---------- */
addPool('act', [
  ['glute_bridge', 'Glute bridge', '', 1, 2, 'r', '', 'Lie on your back, knees bent, feet flat. Squeeze your glutes and lift your hips until shoulders, hips and knees line up. Pause for a second and lower.', 'Glutes are a main power source in the swing and they protect your back.'],
  ['bridge_march', 'Marching bridge', '', 2, 3, 's', '', 'Hold the top of a glute bridge. Lift one foot off the floor without letting your hips drop or twist, set it down and switch.', 'Teaches glutes and core to hold your pelvis steady on one leg.'],
  ['band_walk', 'Lateral band walks', 'band', 1, 3, 's', '', 'Loop a band around your ankles or above the knees. Sink into a quarter squat and step sideways, keeping tension on the band and toes forward.', 'Strengthens the side glutes that stop your hips sliding during the swing.'],
  ['clamshell', 'Clamshells', '', 1, 2, 's', '', 'Lie on your side, knees bent, feet together. Keeping feet touching, lift the top knee without rolling your hips back. Lower slowly.', 'Targets the hip rotators that stabilize your lead leg at impact.'],
  ['hip_abd', 'Standing leg raises', '', 1, 3, 's', '', 'Stand tall holding a wall. Lift one straight leg out to the side without leaning, pause, and lower slowly.', 'Builds side-hip strength for balance on slopes and through your finish.']
]);

/* ---------- Balance ---------- */
addPool('bal', [
  ['sl_stand', 'Single-leg stand', '', 1, 2, 'ts', '', 'Stand near a wall and lift one foot. Hold steady. Too easy? Turn your head side to side or close your eyes.', 'Balance on your lead leg is what lets you finish every swing in control.'],
  ['sl_turns', 'Single-leg golf turns', '', 2, 3, 's', '', 'Stand on your lead leg in golf posture with arms crossed. Turn your shoulders back and through without wobbling. Then switch legs.', 'Combines balance with rotation, which is what your finish position demands.'],
  ['tandem', 'Heel-to-toe walk', '', 1, 2, 'r', '', 'Walk in a straight line, placing each heel directly in front of the other foot. Keep your eyes forward. Walk beside a wall for safety.', 'Sharpens the balance that keeps you steady on uneven lies.'],
  ['clock_reach', 'Single-leg clock reaches', '', 2, 3, 's', 'k', 'Stand on one leg with a soft knee. Reach the free foot forward, out to the side and behind you, tapping lightly each time.', 'Builds ankle, knee and hip control for stable footing through the swing.']
]);

/* ---------- Power: lower body ---------- */
addPool('lpow', [
  ['speed_squat', 'Speed squats', '', 1, 3, 'r', 'k', 'Lower into a squat under control, then drive up as fast as you can, rising onto your toes. Your feet stay on the floor.', 'Teaches you to push hard into the ground, where clubhead speed starts.'],
  ['fast_sts', 'Fast sit-to-stand', '', 1, 2, 'r', '', 'Sit on a sturdy chair with arms crossed. Stand up as fast as you can, then sit back down slowly over three seconds.', 'Leg power fades faster than strength as we age. This trains it with no impact.'],
  ['calf_pop', 'Quick heel raises', '', 1, 3, 'r', '', 'Hold a wall lightly. Rise onto your toes as fast as you can, then lower under control.', 'Ankle power adds to the push off the ground in your downswing.'],
  ['squat_jump', 'Squat jumps', '', 2, 3, 'r', 'kbi', 'Dip into a quarter squat and jump as high as you can. Land softly on the balls of your feet with knees bent, reset, and go again.', 'Jump height is linked to clubhead speed in golfers.'],
  ['lat_bound', 'Lateral bounds', '', 2, 3, 's', 'ki', 'Stand on one leg and leap sideways, landing softly on the other leg. Stick the landing for a second before bounding back.', 'Trains the push from trail side to lead side that drives the downswing.'],
  ['broad_jump', 'Broad jumps', '', 3, 3, 'r', 'kbi', 'Swing your arms back, then jump forward as far as you can. Land softly in a squat and walk back to the start.', 'Builds explosive hip extension for more distance off the tee.'],
  ['box_jump', 'Box jumps', 'bench', 3, 3, 'r', 'ki', 'Jump onto a sturdy box or bench, landing softly with both feet flat. Stand tall, then step down one foot at a time.', 'Develops explosive leg drive with a softer landing than jumping on flat ground.'],
  ['stepup_drive', 'Step-up with knee drive', 'bench', 1, 3, 's', 'k', 'Place one foot on a step. Drive up quickly, lifting the other knee to hip height, then lower slowly on the same leg.', 'Single-leg power with control, like posting up on your lead leg.'],
  ['kb_swing', 'Kettlebell swing', 'db', 2, 3, 'r', 'b', 'Hinge and hike the weight back between your legs, then snap your hips forward so it floats to chest height. Arms stay loose and the hips do the work.', 'Explosive hip extension is a major source of swing speed.'],
  ['mb_slam', 'Medicine ball slams', 'mb', 1, 3, 'r', '', 'Reach a medicine ball overhead, then throw it into the floor in front of you as hard as you can, hinging at the hips. Pick it up and repeat.', 'Builds full-body power and the trunk muscles that pull the club down.']
]);

/* ---------- Power: rotational ---------- */
addPool('rpow', [
  ['speed_swing', 'Speed swings', '', 1, 3, 's', '', 'Flip a club over and grip it near the head. Make full swings as fast as you can, listening for the whoosh after where the ball would be. Then swing the other way round.', 'Swinging something light at full effort teaches your body to move faster.'],
  ['step_swing', 'Step-through swings', '', 2, 3, 'r', '', 'Start with feet together and a club in hand. As you finish the backswing, step toward the target with your lead foot and swing through at full speed.', 'Grooves the ground-up sequence of step, hips, torso, arms.'],
  ['band_rot', 'Fast band rotations', 'band', 1, 3, 's', '', 'Anchor a band at chest height and stand side-on in golf posture, arms straight. Rotate away from the anchor as fast as you can, then return slowly.', 'Trains rotational speed against resistance in your actual golf posture.'],
  ['mb_scoop', 'Rotational ball toss', 'mb', 1, 3, 's', 'b', 'Stand side-on to a solid wall with a medicine ball at your back hip. Drive your hips through and throw the ball into the wall. Catch it or let it drop.', 'The closest gym move to a golf swing. Hips lead, torso and arms follow.'],
  ['mb_shot', 'Rotational shot-put throw', 'mb', 2, 3, 's', 'b', 'Stand side-on to a wall with the ball at your back shoulder. Push off the back leg, rotate and punch the ball into the wall.', 'Builds the trail-side push and rotation that deliver the club.'],
  ['mb_rot_slam', 'Rotational ball slams', 'mb', 2, 3, 's', 'b', 'Lift a medicine ball overhead, pivot and slam it to the floor just outside one foot. Alternate sides.', 'Links upper and lower body through a fast, powerful turn.']
]);

/* ---------- Strength: squat ---------- */
addPool('squat', [
  ['sts', 'Slow sit-to-stand', '', 1, 1, 'r', '', 'From a sturdy chair, stand up without using your hands. Lower for three seconds until you lightly touch the seat, then stand again.', 'Builds the basic leg strength behind a stable base and an easy 18-hole walk.'],
  ['bw_squat', 'Bodyweight squat', '', 1, 2, 'r', 'k', 'Feet shoulder-width, toes slightly out. Sit back and down as far as you can with heels flat and chest up, then stand tall.', 'Strong legs give you a stable base and more force into the ground.'],
  ['goblet', 'Goblet squat', 'db', 1, 3, 'r', 'k', 'Hold one dumbbell upright against your chest. Squat between your knees with elbows inside them and chest tall, then drive up.', 'The front load builds your legs and the upright posture you need over the ball.'],
  ['tempo_squat', 'Tempo squat', '', 2, 3, 'r', 'k', 'Lower into a squat over three seconds, pause for one second at the bottom, then stand up fast.', 'Slow lowering builds strength and control with no equipment.'],
  ['skater_squat', 'Skater squat', '', 3, 3, 's', 'k', 'Stand on one leg with the other bent behind you. Lower until the back knee lightly touches a cushion, reaching your arms forward, then stand.', 'Serious single-leg strength for a powerful, stable lead side.'],
  ['bb_squat', 'Barbell squat', 'gym', 3, 3, 'r', 'kb', 'With the bar on your upper back or front shoulders, brace and squat until your thighs are at least parallel. Drive up through the whole foot.', 'More leg strength raises the ceiling on how fast you can swing.'],
  ['leg_press', 'Leg press', 'gym', 1, 3, 'r', '', 'Set feet shoulder-width on the platform. Lower until your knees reach about 90° without your hips lifting, then press back up without locking out.', 'Builds leg strength with your back fully supported.'],
  ['wall_sit', 'Wall sit', '', 1, 3, 't', '', 'Lean your back against a wall and slide down to a depth you can hold, up to thighs parallel. Keep feet flat and weight in your heels.', 'Builds leg endurance for holding posture late in the round.']
]);

/* ---------- Strength: hinge ---------- */
addPool('hinge', [
  ['club_hinge', 'Hip hinge with club', '', 1, 1, 'r', '', 'Hold a club along your spine so it touches your head, upper back and tailbone. With soft knees, push your hips back until your chest tips forward, keeping all three contacts.', 'The hinge is your golf posture. Owning it protects your lower back.'],
  ['good_morning', 'Bodyweight good morning', '', 1, 2, 'r', '', 'Hands behind your head, knees soft. Push your hips straight back until you feel your hamstrings stretch, then squeeze your glutes to stand.', 'Strengthens the hamstrings and glutes that hold your posture all round.'],
  ['sl_rdl', 'Single-leg Romanian deadlift', '', 2, 3, 's', '', 'Stand on one leg with a soft knee. Hinge forward as the free leg reaches straight back, hips square to the floor. Hold a weight in the opposite hand to progress.', 'Builds hip strength and balance one leg at a time, like the swing itself.'],
  ['elev_bridge', 'Single-leg bridge, foot raised', '', 2, 3, 's', '', 'Lie on your back with one heel on a chair and the other leg in the air. Drive through the heel to lift your hips, pause, and lower slowly.', 'Loads the glutes and hamstrings hard with only your body weight.'],
  ['db_rdl', 'Dumbbell Romanian deadlift', 'db', 1, 3, 'r', 'b', 'Hold dumbbells in front of your thighs. Push your hips back and slide the weights down your legs with a flat back, then drive your hips forward to stand.', 'Strengthens the whole back side of the body that powers your downswing.'],
  ['pull_through', 'Band pull-through', 'band', 1, 3, 'r', '', 'Anchor a band low behind you and hold it between your legs, facing away. Hinge back, then snap your hips forward to stand tall.', 'Grooves powerful hip extension with very little load on your spine.'],
  ['hip_thrust', 'Hip thrust', 'bench', 2, 3, 'r', '', 'Rest your upper back on a bench, feet flat, a weight on your hips if you have one. Drive your hips up until your body is level, pause, and lower.', 'The most direct way to strengthen the glutes for speed.'],
  ['deadlift', 'Deadlift', 'gym', 3, 3, 'r', 'b', 'Use a trap bar or barbell. With a flat back and the weight close, push the floor away and stand tall. Lower under control.', 'Total-body strength that carries straight into force off the ground.']
]);

/* ---------- Strength: single leg ---------- */
addPool('lunge', [
  ['sup_split', 'Supported split squat', '', 1, 1, 's', 'k', 'Stand in a split stance holding a chair. Lower your back knee toward the floor, then push up through the front foot.', 'Builds single-leg strength safely for a steadier stance.'],
  ['rev_lunge', 'Reverse lunge', '', 1, 3, 's', 'k', 'Step one foot back and lower until both knees bend to about 90°. Push through the front foot to return. Hold dumbbells to progress.', 'Single-leg strength for stability on sidehill and downhill lies.'],
  ['lat_lunge', 'Lateral lunge', '', 2, 3, 's', 'k', 'Take a big step to the side and sit back into that hip, keeping the other leg straight and both feet flat. Push back to the start.', 'Strengthens the side-to-side movement behind your weight shift.'],
  ['split_squat', 'Split squat', '', 2, 3, 's', 'k', 'In a long split stance, lower straight down until the back knee nearly touches the floor, then drive up. Hold dumbbells to progress.', 'Builds each leg on its own and evens out side-to-side differences.'],
  ['step_up', 'Step-up', 'bench', 1, 3, 's', 'k', 'Place one foot on a step or bench. Stand up using only that leg, then lower slowly for three seconds.', 'Builds the lead-leg strength you post up on through impact.'],
  ['bulgarian', 'Rear-foot-raised split squat', 'bench', 3, 3, 's', 'k', 'Rest your back foot on a bench. Lower until the front thigh is parallel to the floor, then drive up. Hold dumbbells to progress.', 'High-level single-leg strength and hip mobility in one move.'],
  ['side_leg', 'Side-lying leg raise', '', 1, 2, 's', '', 'Lie on your side with legs straight. Lift the top leg about 45° with toes pointing forward, pause, and lower slowly.', 'Side-hip strength keeps your pelvis level, with no load on the knees.'],
  ['hip_airplane', 'Hip airplanes', '', 2, 3, 's', '', 'Stand on one leg holding a wall and hinge forward with the free leg behind you. Rotate your pelvis open toward the ceiling, then closed toward the floor, turning over the standing hip.', 'Trains loaded hip rotation on one leg, the motion of your lead hip through impact.']
]);

/* ---------- Strength: push ---------- */
addPool('push', [
  ['incline_pu', 'Incline push-up', '', 1, 2, 'r', '', 'Place your hands on a counter or bench with your body in a straight line. Lower your chest to the edge and push back up.', 'Builds pushing strength and a braced trunk at a manageable load.'],
  ['knee_pu', 'Knee push-up', '', 1, 2, 'r', '', 'From your knees with hands under your shoulders, keep a straight line from knees to head. Lower your chest to just above the floor and press up.', 'A step toward full push-ups that still trains your trunk to stay braced.'],
  ['pushup', 'Push-up', '', 2, 3, 'r', '', 'Hands just outside shoulder width, body straight from head to heels. Lower your chest to just above the floor and press up.', 'Upper-body strength plus a braced core, both needed at impact.'],
  ['tempo_pu', 'Tempo push-up', '', 3, 3, 'r', '', 'Lower for three seconds, pause just above the floor, then press up fast. Raise your feet on a step to make it harder.', 'Adds strength and control without needing more weight.'],
  ['floor_press', 'Dumbbell press', 'db', 1, 3, 'r', '', 'Lie on a bench or the floor with a dumbbell in each hand. Press up until your arms are straight, then lower until your upper arms reach chest level or touch the floor.', 'Chest and triceps strength supports width and extension through the ball.'],
  ['hk_press', 'Half-kneeling overhead press', 'db', 2, 3, 's', 's', 'Kneel on one knee and hold a dumbbell at the shoulder on that same side. Press overhead without leaning back, then lower.', 'Builds shoulder strength while your core and hips keep you square.'],
  ['band_press', 'Split-stance band press', 'band', 1, 3, 's', '', 'Anchor a band behind you at chest height and stand in a split stance. Press one hand straight forward without letting your torso twist.', 'Your core has to resist rotation while you push, like holding posture at impact.'],
  ['landmine', 'Landmine press', 'gym', 2, 3, 's', '', 'Stand in a split stance holding the end of a barbell at your shoulder. Press it up and forward, reaching at the top.', 'A shoulder-friendly press that ties your arm to your trunk and hips.']
]);

/* ---------- Strength: pull ---------- */
addPool('pull', [
  ['prone_ytw', 'Prone Y-T-W raises', '', 1, 3, 'r', '', 'Lie face down with your forehead on a towel. Lift your arms into a Y, then a T, then pull your elbows back into a W, squeezing your shoulder blades each time. That is one rep.', 'Strengthens the upper back that keeps you in posture for 18 holes.'],
  ['rev_angel', 'Reverse snow angels', '', 2, 3, 'r', '', 'Lie face down with arms lifted just off the floor. Sweep them in a wide arc from overhead to your hips and back without touching down.', 'Builds shoulder-blade control and upper-back endurance.'],
  ['floor_pull', 'Prone pull-downs', '', 1, 3, 'r', '', 'Lie face down with arms reaching overhead, lifted off the floor. Pull your elbows down to your ribs as if doing a pull-up, then reach back out.', 'Trains the lats, which pull the club down from the top.'],
  ['band_row', 'Band row', 'band', 1, 3, 'r', '', 'Anchor a band at chest height. With a tall chest, pull your elbows back past your ribs, squeeze your shoulder blades, and return slowly.', 'Pulling strength balances your shoulders and supports your posture.'],
  ['band_pulldown', 'Kneeling band pull-down', 'band', 1, 3, 'r', '', 'Anchor a band overhead and kneel facing it. Pull your elbows down to your sides, pause, and return with control.', 'Strong lats add speed on the way down and stabilize your shoulders.'],
  ['db_row', 'Single-arm dumbbell row', 'db', 1, 3, 's', '', 'Support one hand on a bench or chair with a flat back. Pull the dumbbell to your hip, pause, and lower fully.', 'Builds the lats and mid-back while your core resists twisting.'],
  ['pulldown', 'Lat pull-down', 'gym', 1, 3, 'r', '', 'Grip the bar just wider than your shoulders. Pull it to your upper chest, leading with your elbows, and return until your arms are straight.', 'The lats help accelerate your arms in the downswing.'],
  ['cable_row', 'Seated cable row', 'gym', 1, 3, 'r', '', 'Sit tall with knees soft. Pull the handle to your lower ribs, squeeze your shoulder blades together, and return with control.', 'Mid-back strength holds your spine angle from address to impact.'],
  ['inv_row', 'Inverted row', 'gym', 2, 3, 'r', '', 'Hang under a bar or straps with your body straight and heels on the floor. Pull your chest to the bar and lower slowly.', 'Builds pulling strength along with a rigid, braced trunk.'],
  ['pullup', 'Pull-up', 'gym', 3, 3, 'r', 's', 'Hang from a bar with arms straight. Pull until your chin clears the bar, then lower all the way down under control.', 'Top-level lat and grip strength for speed and club control.']
]);

/* ---------- Shoulder care ---------- */
addPool('scap', [
  ['wall_lift', 'Wall slide with lift-off', '', 1, 3, 'r', '', 'Face a wall with your forearms against it. Slide them up into a Y, lift your hands an inch off the wall, set them back and slide down.', 'Strengthens the lower traps that keep your shoulders healthy.'],
  ['face_pull', 'Face pull', 'band', 1, 3, 'r', '', 'Anchor a band or cable at face height. Pull toward your forehead with elbows high, finishing with your knuckles pointing back.', 'Offsets rounded golf posture and protects the rotator cuff.'],
  ['band_er', 'Band external rotation', 'band', 1, 3, 's', '', 'Pin your elbow to your side, bent 90°, holding a band anchored across your body. Rotate your forearm outward, pause, and return slowly.', 'The rotator cuff slows your arm after impact. Keep it strong.'],
  ['rev_fly', 'Bent-over reverse fly', 'db', 1, 3, 'r', '', 'Hinge forward with a flat back and light dumbbells hanging. Raise your arms out to the sides, squeeze, and lower slowly.', 'Rear-shoulder strength balances all the forward pull of the swing.'],
  ['side_er', 'Side-lying external rotation', 'db', 1, 3, 's', '', 'Lie on your side with a light dumbbell in the top hand, elbow on your ribs and bent 90°. Rotate the weight up, pause, and lower slowly.', 'Direct rotator cuff work to keep your shoulders durable.']
]);

/* ---------- Grip and carry ---------- */
addPool('carry', [
  ['club_wrist', 'Club wrist hinges', '', 1, 3, 's', '', 'Hold a club at the end of the grip with your arm by your side. Tilt the clubhead up and down using only your wrist, then turn it side to side like a wiper.', 'Forearm strength steadies the club face through impact and rough.'],
  ['towel_wring', 'Towel wringing', '', 1, 3, 'r', '', 'Roll up a towel and grip it with both hands. Wring it out as hard as you can one way, then the other.', 'Grip strength is linked to clubhead speed and club control.'],
  ['suitcase', 'Suitcase carry', 'db', 1, 3, 'ts', '', 'Hold a heavy dumbbell in one hand like a suitcase. Walk slowly and stay perfectly upright, without leaning toward or away from the weight.', 'Resisting the side-bend builds the obliques that hold your spine angle.'],
  ['farmer', 'Farmer carry', 'db', 1, 3, 't', '', 'Hold a heavy dumbbell in each hand. Walk with tall posture, shoulders back and short, steady steps.', 'Builds grip, posture and whole-body stiffness in one move.'],
  ['dead_hang', 'Dead hang', 'gym', 2, 3, 't', 's', 'Hang from a pull-up bar with straight arms and shoulders slightly pulled down. Breathe and hold.', 'Builds grip endurance and opens up your shoulders and lats.']
]);

/* Plan engine: pure functions over a profile and a workout log.
   Depends on LIB, CAT and TYPES from data.js. */
const Engine = (function () {
  'use strict';
  const BY = {};
  LIB.forEach(function (e) { BY[e.id] = e; });
  const STRENGTH = ['A', 'B', 'C'];
  const LEVELS = ['', 'Beginner', 'Intermediate', 'Advanced'];

  /* ---- dates as local YYYY-MM-DD strings ---- */
  const pad = function (n) { return (n < 10 ? '0' : '') + n; };

    iso: function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
    parse: function (s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); },
    add: function (s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },

  /* ---- first-launch fitness check ---- */
  function assess(a) {
    const score = (a.act || 0) + (a.exp || 0) + (a.pu || 0) + (a.bal || 0);
    let level = score <= 3 ? 1 : score <= 7 ? 2 : 3;
    if ((a.exp || 0) === 0 && level > 2) level = 2;
    if ((a.pu || 0) === 0 && (a.bal || 0) === 0) level = 1;
    return { score: score, max: 11, level: level, mob: a.flex == null ? 1 : a.flex };
  }

  /* ---- what the golfer can do ---- */
  function has(P, eq) {
    if (!eq) return true;
    const e = P.equip || {};
    return !!e[eq] || (eq !== 'gym' && !!e.gym);
  }
  function lowImpact(P) {
    const l = P.limits || {};
    return P.age >= 55 || P.level < 2 || !!l.knee || !!l.back;
  }
  function candidates(pool, P, o) {
    const L = o && o.easy ? 1 : P.level, lim = P.limits || {}, li = lowImpact(P);
    const base = LIB.filter(function (e) { return e.pool === pool && has(P, e.eq) && !(li && e.fl.indexOf('i') >= 0); });
    const okS = function (e) {
      return !((lim.knee && e.fl.indexOf('k') >= 0) || (lim.back && e.fl.indexOf('b') >= 0) || (lim.shoulder && e.fl.indexOf('s') >= 0));
    };
    const inL = function (e) { return e.lo <= L && L <= e.hi; };
    const under = function (e) { return e.lo <= L; };
    let c = base.filter(function (e) { return okS(e) && inL(e); });
    if (c.length) return c;
    c = base.filter(function (e) { return okS(e) && under(e); });
    if (c.length) return c;
    c = base.filter(inL);
    if (c.length) return c;
    return base.filter(under);
  }

  /* ---- rotation ---- */
  function lastUsedMap(log) {
    const m = {};
    log.forEach(function (e, i) { (e.ex || []).forEach(function (id) { m[id] = i; }); });
    return m;
  }
  const fit = function (e) { return e.lo + (e.eq ? 1 : 0); };
  const byFit = function (a, b) { return fit(b) - fit(a) || (b.eq ? 1 : 0) - (a.eq ? 1 : 0) || a.idx - b.idx; };
  function ranked(pool, P, lu, used, o) {
    let c = candidates(pool, P, o).filter(function (e) { return !used.has(e.id); });
    const cat = CAT[pool];
    if (cat === 'str' || cat === 'pow') {
      c = c.slice().sort(byFit).slice(0, 3);
    }
    const when = function (e) { return lu[e.id] == null ? -1 : lu[e.id]; };
    return c.slice().sort(function (a, b) { return when(a) - when(b) || byFit(a, b); });
  }
  function nextFromTypes(types, P) {
    let sinceM = 0, lastS = null;
    for (let i = types.length - 1; i >= 0; i--) { if (types[i] === 'M') break; sinceM++; }
    for (let i = types.length - 1; i >= 0; i--) { if (types[i] !== 'M') { lastS = types[i]; break; } }
    if (P.days >= 4 && sinceM >= 2) return 'M';
    if (!lastS) return 'A';
    return STRENGTH[(STRENGTH.indexOf(lastS) + 1) % 3];
  }
  function nextType(log, P) { return nextFromTypes(log.map(function (e) { return e.type; }), P); }
  function upcoming(log, P, n) {
    const types = log.map(function (e) { return e.type; }), out = [];
    for (let i = 0; i < n; i++) { const t = nextFromTypes(types, P); out.push(t); types.push(t); }
    return out;

  function dueInfo(log, P, today) {

    const last = log[log.length - 1];
    let gap = P.days >= 4 ? 1 : P.days === 3 ? 2 : 3;
    if (gap === 1) {
      const dates = {};
      log.forEach(function (e) { dates[e.date] = 1; });
      let run = 1, d = last.date;
      while (dates[D.add(d, -1)]) { run++; d = D.add(d, -1); }

  /* ---- prescription: sets, reps, rest ---- */
  const REPS = ['6–8', '8–10', '10–12', '12–15'];
  function rx(ex, P, o) {

    let sets = 1, amt = '', rest = 0, hold = 0;

    } else if (cat === 'act') {

    } else if (cat === 'bal') {

    } else if (cat === 'pow') {

    } else if (cat === 'str') {
      sets = pick([2, 3, 3]); if (P.mins >= 45) sets = L === 3 ? 4 : 3; if (P.mins <= 20) sets = Math.min(sets, 2);
      if (m === 't' || m === 'ts') hold = pick([30, 40, 50]); else amt = REPS[Math.min(3, (3 - L) + (older ? 1 : 0))];
      rest = pick([45, 60, 90]) + (older ? 15 : 0);
    } else if (cat === 'acc') {
      sets = 2; amt = '12–15'; rest = 30;
    } else if (cat === 'carry') {
      sets = L === 3 ? 3 : 2; rest = 45;
      if (m === 't') hold = pick([30, 40, 45]); else if (m === 'ts') hold = pick([20, 30, 30]); else if (m === 's') amt = '10–12'; else amt = '8–10';
    } else if (cat === 'core') {
      sets = pick([2, 2, 3]); if (P.mins <= 20) sets = 2; if (o.type === 'M') sets = 2; rest = 30;
      if (m === 't') hold = pick([20, 30, 45]); else if (m === 'ts') hold = pick([15, 25, 35]); else if (m === 's') amt = pick(['6', '8', '10']); else amt = pick(['10', '16', '20']);
    } else { /* stretch */
      sets = 1;
      hold = m === 't' ? (P.mob === 0 ? 60 : 45) : (P.mob === 0 ? 45 : 30);
    }
    if (o.ease && (cat === 'str' || cat === 'pow')) sets = Math.max(1, sets - 1);
    return { sets: sets, amt: amt, hold: hold, rest: rest, side: m === 's' || m === 'ts', cat: cat };
  }
  function rxLabel(r) {
    const what = r.hold ? r.hold + '\u00a0s' : r.amt;
    return r.sets + ' × ' + what + (r.side ? ' each side' : '');
  }
  function effort(ex, P) {
    const cat = CAT[ex.pool];
    if (cat === 'str') {
      const left = [3, 2, 1][P.level - 1] + (P.age >= 65 ? 1 : 0);
      return 'Pick a load or pace that leaves about ' + left + (left === 1 ? ' rep' : ' reps') + ' in the tank on each set.';
    }
    if (cat === 'pow') return 'Every rep at full speed. Stop the set as soon as you slow down.';
    if (cat === 'mob') return 'Smooth and controlled. Never force a range.';
    if (cat === 'stretch') return 'Breathe slowly. Mild tension, never pain.';
    if (cat === 'bal') return 'Stay near a wall or hold a club for safety.';
    if (cat === 'core') return 'Stop the set when your form slips.';
    if (cat === 'carry') return 'Heavy enough that your grip is working hard by the end.';
    if (cat === 'acc') return 'Light and strict. Feel the back of the shoulder work.';
    return 'Squeeze and control every rep.';
  }
  function secs(ex, r) {
    let work;
    const pow = r.cat === 'pow', soft = r.cat === 'mob' || r.cat === 'act';
    if (r.hold) work = r.side ? r.hold * 2 + 5 : r.hold;
    else if (pow) work = r.side ? 30 : 15;
    else if (soft) work = r.side ? 50 : 30;
    else work = r.side ? 60 : 35;
    return r.sets * (work + r.rest) + 25;
  }

  /* ---- build a session ---- */
  function buildPlan(type, P, log, today) {
    const T = TYPES[type], lu = lastUsedMap(log), used = new Set();
    const ease = log.length > 0 && D.diff(today, log[log.length - 1].date) >= 10;
    const target = type === 'M' ? ({ 20: 14, 30: 20, 45: 26 }[P.mins] || 20) : P.mins;
    const slots = [];
    T.blocks.forEach(function (b) {
      b[1].forEach(function (s) {
        if (s[2] === 'age55' && P.age < 55) return;
        slots.push({ pool: s[0], min: s[1], cond: s[2], block: b[0], ord: slots.length });
      });
    });
    const order = slots.slice().sort(function (a, b) { return a.min - b.min || a.ord - b.ord; });
    order.forEach(function (s) {
      const ex = ranked(s.pool, P, lu, used, { easy: s.cond === 'easy' })[0];
      if (!ex) return;
      used.add(ex.id);
      s.ex = ex; s.rx = rx(ex, P, { type: type, ease: ease }); s.sec = secs(ex, s.rx);
    });
    const ok = order.filter(function (s) { return s.ex; });
    let inc = ok.filter(function (s) { return s.min <= P.mins; });
    const extra = ok.filter(function (s) { return s.min > P.mins; });
    const mins = function (a) { return a.reduce(function (t, s) { return t + s.sec; }, 0) / 60; };
    while (mins(inc) < target * 0.8 && extra.length) inc.push(extra.shift());
    while (mins(inc) > target * 1.2) {
      const c = inc.filter(function (s) { return s.min > 20; }).sort(function (a, b) { return b.min - a.min || b.ord - a.ord; })[0];
      if (!c) break;
      inc = inc.filter(function (s) { return s !== c; });
    }
    inc.sort(function (a, b) { return a.ord - b.ord; });
    return {
      type: type, ease: ease, est: Math.max(5, Math.round(mins(inc) / 5) * 5),
      items: inc.map(function (s) { return { ex: s.ex, pool: s.pool, block: s.block, rx: s.rx, cond: s.cond }; })
    };
  }
  /* The next option for a slot when the golfer asks to swap. */
  function swapFor(item, P, log, planIds, type, ease) {

    const pos = all.findIndex(function (e) { return e.id === item.id; });
    const rotated = all.slice(pos + 1).concat(all.slice(0, Math.max(0, pos)));
    const nx = rotated.filter(function (e) { return !used.has(e.id); })[0];

  function previousInPool(pool, log) {

  function facts(P) {
    const out = [], r = E.rx(BY.goblet, P, { type: 'A' });
    out.push(['Level', LEVELS[P.level] + '. Strength moves are ' + r.sets + ' sets of ' + r.amt + ' reps with ' + r.rest + ' seconds of rest, using ' + ['the simplest', 'moderate', 'the most demanding'][P.level - 1] + ' versions of each movement.']);
    if (P.age >= 55) out.push(['Age ' + P.age, 'No jumping. Power comes from fast, low-impact moves, a balance drill opens every strength workout, and rests run 15 seconds longer.' + (P.age >= 65 ? ' You also keep one extra rep in reserve.' : '')]);

    out.push(['Mobility', ['Your toe-reach was limited, so warm-up mobility drills are doubled and stretches are held longer.', 'Your toe-reach was average. Every workout opens with mobility drills and closes with stretches.', 'Your toe-reach was good. Mobility work is there to keep the range you have.'][P.mob]]);
    const lim = LIMITS.filter(function (x) { return P.limits[x[0]]; }).map(function (x) { return x[1].toLowerCase(); });
    if (lim.length) out.push(['Protecting', 'Exercises that load your ' + listText(lim) + ' are swapped for gentler options.']);
    const eq = EQUIP.filter(function (x) { return P.equip[x[0]]; }).map(function (x) { return x[1]; });
    out.push(['Equipment', eq.length ? eq.join(', ') + '. A golf club, a chair and a wall cover the rest.' : 'Bodyweight only. A golf club, a chair and a wall are all you need.']);
    out.push(['Schedule', P.days + ' days a week, about ' + P.mins + ' minutes. ' + (P.days >= 4 ? 'A workout comes due most days, with a mobility session after every two strength workouts.' : P.days === 3 ? 'A workout comes due every second day.' : 'A workout comes due every third day.')]);
    return out;
  }

  /* ================= Today ================= */
  function planRows(items, live) {
    let html = '', n = 0, block = null;
    items.forEach(function (it, i) {
      const ex = it.ex || BY[it.id];

        html += '<div class="blk-head">' + esc(block) + '</div><ol class="rows' + (live ? ' live' : '') + '">';
      }
      n++;
      if (!live) {
        const prev = E.previousInPool(it.pool, S.log);
        html += '<li><span class="n">' + n + '</span><span class="nm">' + esc(ex.name) +
          (prev && prev.id !== ex.id ? '<small>Last time: ' + esc(prev.name) + '</small>' : '') +
          '</span><span class="rx">' + E.rxLabel(it.rx) + '</span></li>';
        return;
      }
      const done = it.done >= it.rx.sets, open = UI.open === i;
      let boxes = '';
      for (let k = 0; k < it.rx.sets; k++) {
        boxes += '<button type="button" class="box' + (k < it.done ? ' on' : '') + '" data-act="set" data-i="' + i + '" data-k="' + k + '" aria-pressed="' + (k < it.done) + '" aria-label="' + esc(ex.name) + ', set ' + (k + 1) + ' of ' + it.rx.sets + '">' + (k < it.done ? '✓' : (k + 1)) + '</button>';
      }
      html += '<li class="' + (done ? 'done ' : '') + (open ? 'open' : '') + '"><span class="n">' + n + '</span>' +
        '<button type="button" class="row-main" data-act="toggle" data-i="' + i + '" aria-expanded="' + open + '"><span class="nm">' + esc(ex.name) +
        '<small>' + E.rxLabel(it.rx) + (it.rx.rest ? ' · rest\u00a0' + it.rx.rest + '\u00a0s' : '') + '</small></span></button>' +
        '<div class="boxes">' + boxes + '</div>';
      if (open) {
        const prev = E.previousInPool(it.pool, S.log);
        html += '<div class="detail"><p><span class="lab">How</span>' + esc(ex.how) + '</p>' +
          '<p><span class="lab">Why it helps your golf</span>' + esc(ex.why) + '</p>' +
          '<p><span class="lab">Effort</span>' + esc(E.effort(ex, S.profile)) + '</p>' +
          (prev && prev.id !== ex.id ? '<p class="small muted">Rotated in for ' + esc(prev.name) + ', which filled this slot last time.</p>' : '') +

          '<a class="chip-btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' exercise how to') + '">Find a demo video ↗</a>' +
          '<button type="button" class="chip-btn" data-act="swap" data-i="' + i + '">Swap exercise</button></div></div>';

  function weekStrip(info, today) {
    const P = S.profile, ws = D.weekStart(today), dows = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    let cells = '';

      const d = D.add(ws, i), es = S.log.filter(function (e) { return e.date === d; });

      else if (d === info.due && d >= today) m = '<span class="mark due" aria-label="Workout ' + info.type + ' due">' + info.type + '</span>';
      else m = '<span class="mark empty" aria-hidden="true"></span>';
      cells += '<div class="' + (d === today ? 'is-today' : '') + '"><span class="dow">' + dows[i] + '</span>' + m + '<span class="dn">' + D.parse(d).getDate() + '</span></div>';
    }
    const n = E.weekCount(S.log, ws);
    return '<section class="week"><div class="week-head"><span class="eyebrow muted">This week</span><span class="small num"><b>' + n + '</b> of ' + P.days + ' workouts</span></div><div class="week-row">' + cells + '</div></section>';
  }
  function vToday() {
    const P = S.profile, today = D.today(), info = E.dueInfo(S.log, P, today), ses = S.session;
    const type = ses ? ses.type : info.type, T = TYPES[type];
    const plan = ses ? null : E.buildPlan(type, P, S.log, today);
    const items = ses ? ses.items : plan.items;
    const doneToday = S.log.some(function (e) { return e.date === today; }), dueToday = info.due === today;
    const up = E.upcoming(S.log, P, 3);
    let eyebrow, pill, note, cta;
    if (ses) {
      const st = sesStats(ses);
      eyebrow = 'In progress'; pill = st.done + ' of ' + st.total + ' sets';

    } else {
      eyebrow = 'Next up';
      pill = dueToday ? 'Due today' : 'Due ' + rel(info.due);
      note = info.last ? 'Last workout: ' + TYPES[info.last.type].name + ', ' + ago(info.last.date) + '.' : 'Your first workout. After this the rotation moves to ' + TYPES[up[1]].name + '.';
      if (doneToday) note = 'Today is logged. ' + note;
      if (plan.ease) note += ' It has been a while, so strength and power moves drop one set today.';

    }
    let rot = '';
    if (info.last) rot += '<li class="was"><b>' + info.last.type + '</b><i>Last</i></li>';
    up.forEach(function (t, i) { rot += '<li class="' + (i === 0 ? 'next' : '') + '"><b>' + t + '</b><i>' + (i === 0 ? 'Next' : i === 1 ? 'Then' : 'After') + '</i></li>'; });
    const est = ses ? ses.est : plan.est;
    let html = '<header class="top"><span class="brand disp">Fairway Strength</span><span class="date">' + fmt(today, { weekday: 'long', month: 'short', day: 'numeric' }) + '</span></header>' +

    }
    html += '<section class="card"><div class="card-head"><h2>On the card</h2><span>' + (ses ? 'This workout' : 'Workout ' + type) + '</span></div>' + planRows(items, false) + '</section>';

  }

  /* ================= session ================= */
  function vSession() {

    return '<div class="ses-top"><button data-act="leave">← Back to today</button><span class="clock" id="clock" aria-label="Elapsed time">' + mmss((Date.now() - ses.startedAt) / 1000) + '</span></div>' +

      '<div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + st.total + '" aria-valuenow="' + st.done + '" aria-label="Sets done"><i style="width:' + (st.total ? 100 * st.done / st.total : 0) + '%"></i></div>' +
      '<span class="small muted num">' + st.done + ' of ' + st.total + ' sets done. Tap a box after each set. Tap an exercise for instructions.</span></div>' +
      (ses.ease ? '<div class="notice"><p><strong>Easing back in.</strong> It has been a while since your last workout, so strength and power moves have one set fewer today.</p></div>' : '') +

  }
  function startSession(type) {
    const P = S.profile, plan = E.buildPlan(type, P, S.log, D.today());
    S.session = {
      type: type, startedAt: Date.now(), ease: plan.ease, est: plan.est,
      items: plan.items.map(function (it) { return { id: it.ex.id, pool: it.pool, block: it.block, cond: it.cond || null, rx: it.rx, done: 0 }; })
    };
    UI.inSession = true; UI.open = 0; UI.feel = 0; saveLocal(); armAudio(); wake();
  }
  function saveSession(feel, date) {
    const ses = S.session, st = sesStats(ses), today = D.today();
    if (!DATE_RE.test(date) || date > today) date = today;
    const ticked = ses.items.filter(function (it) { return it.done > 0; });
    const elapsed = Math.round((Date.now() - ses.startedAt) / 60000);
    const entry = {
      id: newId(), date: date, type: ses.type, feel: feel || 0,
      min: date === today && elapsed >= 3 && elapsed <= 180 ? elapsed : 0,
      ex: (ticked.length ? ticked : ses.items).map(function (it) { return it.id; })
    };
    S.log.push(entry); sortLog(S.log);
    S.session = null; UI.inSession = false; stopTimer(); unwake();
    commit();
    const info = E.dueInfo(S.log, S.profile, today);
    UI.sheet = { kind: 'logged', entry: entry, next: info, sets: st };
    UI.tab = 'today';
  }
  function levelNudge() {
    const P = S.profile, since = S.prefs.promptAt || 0;
    const f = S.log.filter(function (e) { return e.type !== 'M' && e.feel && e.id > since; }).sort(function (a, b) { return a.id - b.id; }).map(function (e) { return e.feel; });
    if (f.length >= 3 && f.slice(-3).every(function (x) { return x === 1; }) && P.level < 3) return 1;
    if (f.length >= 2 && f.slice(-2).every(function (x) { return x === 3; }) && P.level > 1) return -1;
    return 0;
  }

  /* ================= Record ================= */
  function entryRow(e) {
    const open = UI.entryOpen === e.id, T = TYPES[e.type];
    const meta = [fmt(e.date)]; if (e.min) meta.push(e.min + ' min'); if (e.feel) meta.push('Felt ' + FEEL[e.feel].toLowerCase());
    let html = '<li><button type="button" class="entry-main" data-act="entry" data-id="' + e.id + '" aria-expanded="' + open + '">' + mark(e.type) +
      '<span><b>' + esc(T.name) + '</b><small>' + esc(meta.join(' · ')) + '</small></span><span class="chev">' + (open ? '▲' : '▼') + '</span></button>';
    if (open) {
      const armed = UI.armed === 'del' + e.id;
      html += '<div class="entry-detail"><p>' + (e.ex.length ? esc(e.ex.map(function (id) { return BY[id].name; }).join(', ')) : 'No exercises recorded.') + '</p>' +
        '<button type="button" class="btn danger" style="padding:10px" data-act="del" data-id="' + e.id + '">' + (armed ? 'Tap again to delete for good' : 'Delete this entry') + '</button></div>';
    }

  }
  function vRecord() {

      } else if (iso === info.due) cells += '<div class="' + cls + '"><span>' + d + '</span><span class="mark due" aria-label="Workout ' + info.type + ' due">' + info.type + '</span></div>';

      '<section class="card"><div class="card-head"><h2>' + (UI.daySel ? esc(fmt(UI.daySel)) : 'Sessions') + '</h2>' + (UI.daySel ? '<button class="link" data-act="day" data-d="">Show whole month</button>' : '<span>' + inMonth.length + ' this month</span>') + '</div>' +
