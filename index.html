        ['A', 'B', 'C', 'M'].map(function (t) {
          const last = S.log.filter(function (e) { return e.type === t; }).pop();
          return '<li><button type="button" data-act="start" data-type="' + t + '">' + mark(t) + '<span><b>' + esc(TYPES[t].name) + '</b><small>' + (last ? 'Last done ' + ago(last.date) : 'Not done yet') + '</small></span></button></li>';
        }).join('') + '</ul></section><button class="btn quiet" data-act="close">Cancel</button>';
    } else if (sh.kind === 'reset') {
      h = '<h2>Erase everything?</h2><p>This deletes your plan and all ' + S.log.length + ' logged workouts on every device. It cannot be undone.</p>' +
        '<button class="btn danger" data-act="reset">Erase my plan and record</button><button class="btn quiet" data-act="close">Keep everything</button>';
    } else if (sh.kind === 'discard') {
      h = '<h2>Discard this workout?</h2><p>Nothing from this session will go on your record.</p>' +
        '<button class="btn danger" data-act="discard">Discard workout</button><button class="btn quiet" data-act="close">Keep it</button>';
    } else if (sh.kind === 'backup') {
      const has = !!(S.profile || S.log.length);
      h = '<h2>Backup</h2>' +
        (has ? '<p>Your backup is a block of text. Keep a copy somewhere safe, such as Notes or an email to yourself.</p>' +
          '<button class="btn solid" data-act="backup-copy">Copy my backup</button>' +
          (sh.out ? '<textarea class="code-in" id="bk-out" readonly rows="3" aria-label="Backup text">' + esc(sh.out) + '</textarea>' : '') : '') +
        (sh.msg ? '<p class="small" role="status"><strong>' + esc(sh.msg) + '</strong></p>' : '') +
        '<div><label class="eyebrow muted" for="bk-in" style="display:block;margin-bottom:8px">Restore: paste a backup here</label>' +
        '<textarea class="code-in" id="bk-in" rows="3" placeholder="Paste backup text" autocomplete="off" autocapitalize="off" spellcheck="false">' + esc(sh.inp || '') + '</textarea></div>' +
        (sh.err ? '<p class="small" style="color:var(--red)" role="alert">' + esc(sh.err) + '</p>' : '') +
        '<button class="btn line" data-act="backup-restore">Restore from pasted text</button><button class="btn quiet" data-act="close">Close</button>';
    } else if (sh.kind === 'level') {
      const P = S.profile, to = P.level + sh.dir;
      h = sh.dir > 0
        ? '<h2>Ready to move up?</h2><p>Your last three strength workouts felt easy. ' + LEVELS[to] + ' adds harder exercises and heavier sets.</p>'
        : '<h2>Ease off a level?</h2><p>Your last two strength workouts felt hard. ' + LEVELS[to] + ' uses simpler exercises and lighter sets while you build up.</p>';
      h += '<button class="btn solid" data-act="level-yes">Move to ' + LEVELS[to] + '</button><button class="btn quiet" data-act="level-no">Stay at ' + LEVELS[P.level] + '</button>';
    }
    const fresh = !el.classList.contains('on') || el.dataset.kind !== sh.kind;
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">' + h + '</div>';
    el.classList.add('on'); el.dataset.kind = sh.kind;
    if (fresh) { try { el.firstChild.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }
  function closeSheet() { UI.sheet = null; UI.armed = null; }
  function backupText() { return JSON.stringify({ app: 'fairway-strength', v: 1, savedAt: Date.now(), profile: S.profile, log: S.log }); }
  /* Add a backup's workouts to the record. Returns the number added, or -1 if the text is not a backup. */
  function restoreBackup(text) {
    let o;
    try { o = JSON.parse(String(text).trim()); } catch (e) { return -1; }
    if (!o || o.app !== 'fairway-strength') return -1;
    const R = norm(o), gone = new Set(S.removed);
    const sig = function (e) { return e.date + '|' + e.type + '|' + e.ex.join(','); };
    const ids = new Set(S.log.map(function (e) { return e.id; })), seen = new Set(S.log.map(sig));
    let added = 0;
    R.log.forEach(function (e) {
      if (ids.has(e.id) || seen.has(sig(e))) return;
      if (e.id <= S.resetAt || gone.has(e.id)) e.id = newId();
      S.log.push(e); ids.add(e.id); seen.add(sig(e)); added++;
    });
    sortLog(S.log);
    if (R.profile && !S.profile) { S.profile = R.profile; S.profile.at = Date.now(); }
    commit();
    return added;
  }

  /* ================= render ================= */
  function focusKey(el) {
    if (!el || !el.dataset || !el.dataset.act) return el && el.id ? '#' + el.id : null;
    return Object.keys(el.dataset).map(function (k) { return '[data-' + k.replace(/[A-Z]/g, function (c) { return '-' + c.toLowerCase(); }) + '="' + el.dataset[k] + '"]'; }).join('');
  }
  function render(reset) {
    const view = $('#view'), tabs = $('#tabs');
    let key, html;
    if (UI.booting) { key = 'boot'; html = '<div class="splash"><p>Loading your plan</p></div>'; }
    if (UI.ob && !UI.ob.retake && UI.ob.step === 0 && S.profile) UI.ob = null;
    if (UI.booting) { /* keep the splash */ }
    else if (needsInstall()) { key = 'install'; html = vInstall(); }
    else if (UI.ob || !S.profile) { if (!UI.ob) UI.ob = newOb(); key = 'ob' + UI.ob.step; html = vOnboard(); }
    else if (S.session && UI.inSession) { key = 'session'; html = vSession(); }
    else { UI.inSession = false; key = UI.tab; html = UI.tab === 'record' ? vRecord() : UI.tab === 'plan' ? vPlan() : vToday(); }
    const same = key === UI.lastView && !reset, keep = same ? view.scrollTop : 0;
    let fk = null;
    try { fk = same ? focusKey(document.activeElement) : null; } catch (e) { fk = null; }
    view.innerHTML = html; view.scrollTop = keep; UI.lastView = key;
    const showTabs = key === 'today' || key === 'record' || key === 'plan';
    tabs.hidden = !showTabs;
    $('#app').dataset.chrome = showTabs ? 'tabs' : 'none';
    tabs.querySelectorAll('button').forEach(function (b) { if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    renderSheet();
    if (fk) { try { const f = document.querySelector('#app ' + fk); if (f) f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    if (key === 'session') { if (!clockTick) clockTick = setInterval(paintClock, 1000); }
    else { if (clockTick) { clearInterval(clockTick); clockTick = null; } }
    paintTimer();
  }

  /* ================= events ================= */
  function setAge(id, val) {
    val = clamp(Math.round(val) || 0, 13, 99);
    if (id === 'ob-age') UI.ob.a.age = val;
    else if (S.profile && S.profile.age !== val) { S.profile.age = val; touchProfile(); }
  }
  function onClick(ev) {
    const el = ev.target.closest('[data-act],[data-tab]');
    if (!el) { if (ev.target.id === 'sheet' && UI.sheet && UI.sheet.kind !== 'logged') { closeSheet(); render(); } return; }
    if (el.dataset.tab) { UI.tab = el.dataset.tab; UI.armed = null; UI.daySel = null; render(true); return; }
    const a = el.dataset.act, v = el.dataset.v, P = S.profile, ob = UI.ob, ses = S.session;
    let reset = false;
    switch (a) {
      /* ----- fitness check ----- */
      case 'skip-install': UI.skipInstall = true; reset = true; break;
      case 'ob-start': ob.step = 1; reset = true; break;
      case 'ob-back':
        if (ob.step === 1 && ob.retake) { UI.ob = null; UI.tab = 'plan'; }
        else ob.step = Math.max(0, ob.step - 1);
        reset = true; break;
      case 'ob-opt': ob.a[Q[ob.step - 1].k] = +v; ob.a.level = null; ob.step++; reset = true; break;
      case 'ob-multi': {
        const q = Q[ob.step - 1], sel = ob.a[q.k];
        if (sel[v]) delete sel[v]; else sel[v] = true;
        ob.a[q.k === 'limits' ? 'noLim' : 'noEq'] = false; break;
      }
      case 'ob-none': {
        const q = Q[ob.step - 1], nk = q.k === 'limits' ? 'noLim' : 'noEq';
        ob.a[nk] = !ob.a[nk]; if (ob.a[nk]) ob.a[q.k] = {}; break;
      }
      case 'ob-next': ob.a.age = clamp(Math.round(ob.a.age) || 45, 13, 99); ob.step++; reset = true; break;
      case 'ob-days': ob.a.days = +v; break;
      case 'ob-mins': ob.a.mins = +v; break;
      case 'ob-level': ob.a.level = +v; break;
      case 'ob-finish':
        S.profile = obProfile(); UI.ob = null; UI.tab = 'today'; commit(); reset = true;
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { }); } catch (e) { /* not supported */ }
        break;
      case 'age': {
        const inp = document.getElementById(el.dataset.for);
        setAge(el.dataset.for, (+inp.value || 0) + (+el.dataset.d)); break;
      }
      /* ----- today and session ----- */
      case 'start': closeSheet(); startSession(el.dataset.type); reset = true; break;
      case 'resume': UI.inSession = true; UI.open = ses.items.findIndex(function (x) { return x.done < x.rx.sets; }); armAudio(); wake(); reset = true; break;
      case 'leave': UI.inSession = false; UI.tab = 'today'; reset = true; break;
      case 'pick': UI.sheet = { kind: 'pick' }; break;
      case 'toggle': { const i = +el.dataset.i; UI.open = UI.open === i ? -1 : i; break; }
      case 'set': {
        const it = ses.items[+el.dataset.i], k = +el.dataset.k, before = it.done;
        it.done = k === it.done - 1 ? k : k + 1;
        if (it.done > before) {
          armAudio();
          const all = ses.items.every(function (x) { return x.done >= x.rx.sets; });
          if (it.rx.rest > 0 && !all) startTimer('Rest', it.rx.rest); else stopTimer();
          if (it.done >= it.rx.sets) UI.open = ses.items.findIndex(function (x) { return x.done < x.rx.sets; });
        }
        saveLocal(); break;
      }
      case 'hold': { armAudio(); const it = ses.items[+el.dataset.i]; startTimer('Hold', it.rx.hold); break; }
      case 'swap': {
        const i = +el.dataset.i, it = ses.items[i];
        const nx = E.swapFor(it, P, S.log, ses.items.map(function (x) { return x.id; }), ses.type, ses.ease);
        if (nx) { it.id = nx.ex.id; it.rx = nx.rx; it.done = 0; saveLocal(); }
        break;
      }
      case 't-add': if (UI.timer) { UI.timer.end += 15000; UI.timer.total += 15000; paintTimer(); } return;
      case 't-skip': stopTimer(); return;
      case 'finish': UI.sheet = { kind: 'finish' }; break;
      case 'feel': { const d = $('#f-date'); if (d) UI.sheet.date = d.value; UI.feel = UI.feel === +v ? 0 : +v; break; }
      case 'save': { const d = $('#f-date'); saveSession(UI.feel, d ? d.value : D.today()); reset = true; break; }
      case 'logged-ok': {
        const ent = UI.sheet && UI.sheet.entry;
        closeSheet();
        const n = ent && ent.type !== 'M' && ent.feel ? levelNudge() : 0;
        if (n) UI.sheet = { kind: 'level', dir: n };
        break;
      }
      case 'level-yes': case 'level-no': {
        if (a === 'level-yes') { P.level = clamp(P.level + UI.sheet.dir, 1, 3); P.at = Date.now(); }
        S.prefs.promptAt = S.log.reduce(function (m, e) { return Math.max(m, e.id); }, 0); S.prefs.at = Date.now();
        closeSheet(); commit(); break;
      }
      case 'ask-discard': UI.sheet = { kind: 'discard' }; break;
      case 'discard': S.session = null; UI.inSession = false; stopTimer(); unwake(); closeSheet(); saveLocal(); reset = true; break;
      case 'close': closeSheet(); break;
      /* ----- record ----- */
      case 'month': {
        const cur = UI.month || D.today().slice(0, 7), d = new Date(+cur.slice(0, 4), +cur.slice(5, 7) - 1 + (+el.dataset.d), 1, 12);
        UI.month = D.iso(d).slice(0, 7); UI.daySel = null; UI.entryOpen = null; break;
      }
      case 'day': UI.daySel = el.dataset.d && UI.daySel !== el.dataset.d ? el.dataset.d : null; UI.entryOpen = null; break;
      case 'entry': { const id = +el.dataset.id; UI.entryOpen = UI.entryOpen === id ? null : id; UI.armed = null; break; }
      case 'del': {
        const id = +el.dataset.id;
        if (UI.armed !== 'del' + id) { UI.armed = 'del' + id; break; }
        S.log = S.log.filter(function (e) { return e.id !== id; }); S.removed.push(id);
        UI.armed = null; UI.entryOpen = null; if (UI.daySel && !S.log.some(function (e) { return e.date === UI.daySel; })) UI.daySel = null;
        commit(); break;
      }
      /* ----- plan ----- */
      case 'set-level': P.level = +v; touchProfile(); break;
      case 'set-days': P.days = +v; touchProfile(); break;
      case 'set-mins': P.mins = +v; touchProfile(); break;
      case 'set-eq': if (P.equip[v]) delete P.equip[v]; else P.equip[v] = true; touchProfile(); break;
      case 'set-lim': if (P.limits[v]) delete P.limits[v]; else P.limits[v] = true; touchProfile(); break;
      case 'set-sound': S.prefs.sound = v === '1'; S.prefs.at = Date.now(); if (S.prefs.sound) { armAudio(); beep(); } commit(); break;
      case 'retake': UI.ob = newOb(P); reset = true; break;
      case 'ask-reset': UI.sheet = { kind: 'reset' }; break;
      case 'backup': UI.sheet = { kind: 'backup' }; break;
      case 'backup-copy': {
        const sh = UI.sheet, inp = $('#bk-in'), text = backupText();
        if (inp) sh.inp = inp.value;
        sh.out = text; sh.err = ''; sh.msg = 'Select the text below and copy it.';
        try {
          navigator.clipboard.writeText(text).then(function () {
            if (UI.sheet === sh) { const i2 = $('#bk-in'); if (i2) sh.inp = i2.value; sh.msg = 'Copied. Paste it somewhere safe.'; render(); }
          }, function () { });
        } catch (e) { /* clipboard not available: the text is shown for manual copying */ }
        break;
      }
      case 'backup-restore': {
        const sh = UI.sheet, inp = $('#bk-in'), text = inp ? inp.value : '';
        const hadProfile = !!S.profile, n = restoreBackup(text);
        if (n < 0) { sh.inp = text; sh.msg = ''; sh.err = 'That is not a Fairway Strength backup. Paste the whole text, from the first { to the last }.'; break; }
        sh.inp = ''; sh.err = ''; sh.out = '';
        sh.msg = 'Restored ' + n + (n === 1 ? ' workout' : ' workouts') + (!hadProfile && S.profile ? ' and your plan.' : '.');
        if (S.profile && UI.ob && !UI.ob.retake) { UI.ob = null; UI.tab = 'today'; reset = true; }
        break;
      }
      case 'reset': {
        const at = Date.now();
        S = blank(); S.resetAt = at; UI.ob = null; UI.tab = 'today'; UI.month = null; UI.daySel = null; closeSheet(); stopTimer();
        commit(); reset = true; break;
      }
      default: return;
    }
    render(reset);
  }
  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'ob-age' && UI.ob) {
      const n = Math.round(+t.value) || 0;
      UI.ob.a.age = n;
      const b = document.querySelector('[data-act="ob-next"]');
      if (b) b.disabled = !(n >= 13 && n <= 99);
    }
  }
  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'set-age') { setAge('set-age', +t.value); setTimeout(render, 350); }
  }
  function onKey(ev) {
    if (ev.key === 'Escape' && UI.sheet && UI.sheet.kind !== 'logged') { closeSheet(); render(); }
  }

  /* ================= boot ================= */
  function start(data) {
    loadLocal();
    data = data || {};
    if (data.tab === 'record' || data.tab === 'plan') UI.tab = data.tab;
    if (data.month) UI.month = data.month;
    if (data.ob && !S.profile) UI.ob = data.ob;
    UI.inSession = !!(S.session && data.inSession);
    if (UI.inSession) UI.open = S.session.items.findIndex(function (x) { return x.done < x.rx.sets; });
    const viewer = !!(window.claude && typeof window.claude.use === 'function');
    UI.booting = viewer && !S.profile && !UI.ob;
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { Cloud.pull(); if (!UI.sheet) render(); } });
    render(true);
    if (!viewer && !FRAMED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { /* offline support unavailable */ }
    }
    if (viewer) {
      const ready = function () { if (UI.booting) { UI.booting = false; render(true); } };
      Cloud.init().then(ready, ready);
      setTimeout(ready, 5000);
    }
    try {
      const hot = window.claude && window.claude.hot;
      if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { tab: UI.tab, month: UI.month, ob: S.profile ? null : UI.ob, inSession: UI.inSession }; });
    } catch (e) { /* not in the viewer */ }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();

</script>
</body>
</html>
