<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fairway">
<meta name="theme-color" content="#0F1110">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Fairway Strength</title>
<style>
:root {
  /* Layout idea: one quiet column. Hairline rows instead of boxes, the workout name is the only large type, one green for actions and data. */
  --bg: #FFFFFF;
  --raise: #FFFFFF;
  --fill: #F1F3F2;
  --fill-2: #E3E7E5;
  --seg-on: #FFFFFF;
  --text: #121614;
  --muted: #646E68;
  --faint: #9AA29D;
  --line: #E6E9E7;
  --accent: #1F7A4D;
  --on-accent: #FFFFFF;
  --accent-soft: rgba(31, 122, 77, .11);
  --bar: #B4BCB7;
  --danger: #B83A28;
  --status: #0F1110;
  --scrim: rgba(10, 12, 11, .38);
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(0, 0, 0, .10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1110; --raise: #181B19; --fill: #1C201E; --fill-2: #2A302D; --seg-on: #2F3532;
    --text: #E9ECEA; --muted: #8E9691; --faint: #5F6762; --line: #252A27;
    --accent: #4AAA79; --on-accent: #04120A; --accent-soft: rgba(74, 170, 121, .16);
    --bar: #4A544E; --danger: #EE8A7C; --scrim: rgba(0, 0, 0, .6); --shadow: 0 8px 30px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1110; --raise: #181B19; --fill: #1C201E; --fill-2: #2A302D; --seg-on: #2F3532;
  --text: #E9ECEA; --muted: #8E9691; --faint: #5F6762; --line: #252A27;
  --accent: #4AAA79; --on-accent: #04120A; --accent-soft: rgba(74, 170, 121, .16);
  --bar: #4A544E; --danger: #EE8A7C; --scrim: rgba(0, 0, 0, .6); --shadow: 0 8px 30px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 16px/1.45 var(--font);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none;
  margin: 0; padding: 0; background: none; border: 0; text-align: inherit;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--accent); text-decoration: none; }

#app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: var(--bg); }
/* Under the iPhone status bar the text is white, so that strip stays dark in both themes. */
#app::before { content: ""; flex: none; height: env(safe-area-inset-top, 0px); background: var(--status); }
#view {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 32px;
}
#view:focus { outline: none; }
#view > * { flex-shrink: 0; }
#app[data-chrome="none"] #view { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }

/* ---------- type ---------- */
.title { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.h2 { font-size: 19px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.label { font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.good { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 4px; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.date { font-size: 13px; color: var(--muted); font-weight: 500; }
.prose { font-size: 15px; color: var(--muted); max-width: 60ch; }
.prose strong { color: var(--text); font-weight: 600; }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 16.5px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--fill); color: var(--text); }
.btn.danger { background: var(--fill); color: var(--danger); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: 15px; border-radius: 10px; width: auto; }
.btn:active { opacity: .78; }
.btn[disabled] { opacity: .38; cursor: default; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.link { color: var(--accent); font-weight: 600; font-size: 15px; padding: 10px 0; }
.link.muted { color: var(--muted); font-weight: 500; }
.link.danger { color: var(--danger); }
.center { align-self: center; }

/* ---------- next-up hero ---------- */
.hero { display: flex; flex-direction: column; gap: 6px; }
.hero .btn { margin-top: 14px; }
.hero .then { margin-top: 6px; }
.due-now { color: var(--accent); }

/* ---------- week strip ---------- */
.week { display: flex; flex-direction: column; gap: 12px; }
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); }
.week-row li { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.week-row .d { font-size: 12px; font-weight: 500; color: var(--muted); }
.week-row .today .d { color: var(--text); font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: block; }
.dot.on { background: var(--accent); }
.dot.due { box-shadow: inset 0 0 0 2px var(--accent); }
.dot.off { width: 4px; height: 4px; margin: 3px; background: var(--fill-2); }

/* ---------- exercise lists ---------- */
.group { font-size: 13px; font-weight: 600; color: var(--muted); padding: 18px 0 6px; }
.group:first-child { padding-top: 4px; }
.ex-list > li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
.ex-list > li:first-child { border-top: 0; }
.n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nm { font-size: 16px; font-weight: 500; line-height: 1.3; min-width: 0; }
.nm small { display: block; font-size: 13.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.rx { font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- session ---------- */
.ses-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: -12px; }
.clock { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 3px; background: var(--fill-2); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.items > li { border-top: 1px solid var(--line); }
.items > li:first-child { border-top: 0; }
.item-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.item-main { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline; padding: 13px 0; width: 100%; }
.st { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.st.ok { color: var(--accent); font-weight: 600; }
.items li.done .nm { color: var(--muted); }
.boxes { display: flex; gap: 6px; }
.box { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fill-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.box.on { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.detail { padding: 0 0 18px 36px; display: flex; flex-direction: column; gap: 14px; }
.hint { font-size: 13.5px; color: var(--muted); }
.hint b { color: var(--text); font-weight: 600; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 22px 1fr 70px 62px 40px; gap: 8px; align-items: center; }
.sets.nw .set-row { grid-template-columns: 22px 1fr 70px 40px; }
.set-h { font-size: 12px; font-weight: 600; color: var(--muted); }
.set-h span:nth-child(n+3) { text-align: center; }
.set-row .k { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.set-row .prev { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num-in {
  width: 100%; height: 42px; border: 0; border-radius: 10px; background: var(--fill); color: var(--text);
  text-align: center; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 4px;
  -webkit-appearance: none; appearance: none;
}
.num-in::placeholder { color: var(--faint); }
.set-row.done .num-in { background: var(--accent-soft); }
.tick { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fill-2); display: grid; place-items: center; color: var(--faint); justify-self: end; }
.tick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tick.on { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.tick.next { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-btn { background: var(--fill); color: var(--text); font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.how { display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; color: var(--muted); }
.how b { display: block; color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 1px; }

/* timer */
#timer { display: none; background: var(--raise); border-top: 1px solid var(--line); padding: 10px 20px 12px; }
#timer.on { display: block; }
#app[data-chrome="none"] #timer.on { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
#timer .t-row { display: flex; align-items: center; gap: 10px; }
#timer .t-lab { font-size: 13px; font-weight: 600; color: var(--muted); width: 38px; }
#timer .t-num { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; flex: 1; letter-spacing: -.01em; }
#timer .bar { margin-top: 8px; }
#timer .bar > i { transition: none; }

/* ---------- tabs ---------- */
#tabs { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs[hidden] { display: none; }
#tabs button { flex: 1; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--muted); text-align: center; }
#tabs button[aria-current="page"] { color: var(--accent); }
#tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- figures ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile dt { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.tile dd { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.tile dd small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.tile .delta { font-size: 12.5px; color: var(--muted); }

/* ---------- controls ---------- */
.filters { display: flex; flex-direction: column; gap: 10px; }
.filters .row2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters .row2 .seg { flex: 1 1 220px; }
.seg button { white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); background: transparent; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.chips.fillc .chip { background: var(--fill); color: var(--text); }
.chips.fillc .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 3px; }
.seg button { padding: 8px 6px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 10px; }
.stepper button { width: 40px; height: 40px; font-size: 20px; font-weight: 500; color: var(--accent); text-align: center; }
.stepper .v { min-width: 46px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper input { width: 64px; height: 40px; border: 0; background: transparent; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.text-in { width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: var(--fill); color: var(--text); padding: 11px 14px; font-size: 17px; -webkit-appearance: none; appearance: none; }
.text-in::placeholder { color: var(--faint); }
textarea.text-in { font: 15px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; word-break: break-all; }

/* settings rows */
.fields > div { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.fields > div:first-child { border-top: 0; padding-top: 4px; }
.fields .flab { font-size: 14.5px; font-weight: 500; }
.fields .inline { flex-direction: row; align-items: center; justify-content: space-between; }

/* facts and rows */
.facts > li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.facts > li:first-child { border-top: 0; padding-top: 2px; }
.facts b { font-size: 13px; font-weight: 600; color: var(--muted); }
.rows > li { border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }
.row-btn { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 13px 0; }
.row-btn b { display: block; font-weight: 500; font-size: 16px; }
.row-btn small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.chev { color: var(--faint); font-size: 18px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--text); vertical-align: 1px; margin-left: 6px; }

/* ---------- charts ---------- */
.ex-block { display: flex; flex-direction: column; gap: 10px; padding-top: 22px; border-top: 1px solid var(--line); }
.ex-block:first-child { border-top: 0; padding-top: 0; }
.ex-block .today { font-size: 14.5px; font-variant-numeric: tabular-nums; }
.cmp { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); }
.cmp b { color: var(--text); font-weight: 600; }
.chart { position: relative; touch-action: pan-y; outline-offset: 4px; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart text.vlab { fill: var(--text); font-size: 12px; font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .10; }
.chart .pt { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.chart .b { fill: var(--bar); }
.chart .b.cur { fill: var(--accent); }
.chart .xh { stroke: var(--muted); stroke-width: 1; opacity: 0; shape-rendering: crispEdges; }
.chart .fd { fill: var(--accent); stroke: var(--bg); stroke-width: 2; opacity: 0; }
.chart.hot .xh, .chart.hot .fd { opacity: 1; }
.tip { position: absolute; top: 0; left: 0; z-index: 2; display: none; background: var(--raise); color: var(--text); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; line-height: 1.3; pointer-events: none; white-space: nowrap; }
.chart.hot .tip { display: block; }
.tip b { display: block; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tip span { color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.tbl td { padding: 7px 0; border-top: 1px solid var(--line); }
.tbl th:nth-child(2), .tbl td:nth-child(2) { text-align: right; padding-right: 14px; }
.tbl td:nth-child(3) { color: var(--muted); }
.tbl tr.cur td { font-weight: 600; }

/* ---------- record ---------- */
.cal-nav { display: flex; align-items: center; justify-content: space-between; }
.cal-nav button { width: 40px; height: 36px; font-size: 22px; color: var(--accent); text-align: center; border-radius: 8px; }
.cal-nav button[disabled] { opacity: .3; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cal .dow { font-size: 12px; font-weight: 500; color: var(--muted); text-align: center; padding-bottom: 6px; }
.cal .day { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--text); }
.cal .day .nn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.cal .day.today .nn { background: var(--accent-soft); font-weight: 700; }
.cal .day.sel .nn { box-shadow: inset 0 0 0 1.5px var(--text); }
.cal .day .dot { width: 5px; height: 5px; }
.cal .day .dot.blank { visibility: hidden; }
.cal .day.out { visibility: hidden; }
.entry-main { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 13px 0; }
.entry-main b { display: block; font-weight: 500; font-size: 16px; }
.entry-main small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.entry-detail { padding: 0 0 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.perf-list li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.perf-list li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.empty { font-size: 15px; color: var(--muted); }

/* ---------- editor ---------- */
.ed-items > li { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.ed-items > li:first-child { border-top: 0; }
.ed-head { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; }
.ed-tools { display: flex; gap: 2px; }
.ed-tools button { width: 34px; height: 34px; border-radius: 8px; color: var(--muted); font-size: 16px; text-align: center; }
.ed-tools button[disabled] { opacity: .25; }
.ed-ctl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ed-ctl > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ed-ctl .stepper { display: flex; width: 100%; }
.ed-ctl .stepper button { width: 34px; flex: none; }
.ed-ctl .stepper .v { flex: 1; min-width: 0; font-size: 14.5px; white-space: nowrap; }
.ed-ctl .lab { font-size: 12px; font-weight: 600; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; }

/* ---------- first launch ---------- */
.ob { flex: 1 0 auto; display: flex; flex-direction: column; gap: 22px; }
.ob-nav { display: flex; justify-content: space-between; align-items: center; min-height: 32px; margin-bottom: -6px; }
.opts > li { border-top: 1px solid var(--line); }
.opts > li:first-child { border-top: 0; }
.opt { display: grid; grid-template-columns: 1fr 24px; gap: 12px; align-items: center; width: 100%; padding: 15px 0; font-size: 17px; }
.opt .ck { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fill-2); display: grid; place-items: center; color: transparent; }
.opt .ck svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.opt[aria-pressed="true"] { font-weight: 600; }
.opt[aria-pressed="true"] .ck { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.push { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.steps > li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.steps > li:first-child { border-top: 0; }
.steps b { color: var(--text); font-weight: 600; }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.scores dt { font-size: 12px; color: var(--muted); font-weight: 500; }
.scores dd { font-size: 22px; font-weight: 650; }
.scores dd small { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.fine { font-size: 12.5px; color: var(--muted); }

/* ---------- sheets ---------- */
#sheet { position: absolute; inset: 0; display: none; align-items: flex-end; background: var(--scrim); z-index: 5; }
#sheet.on { display: flex; }
.sheet {
  width: 100%; max-height: 92%; overflow-y: auto; background: var(--raise); border-radius: 16px 16px 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  box-shadow: var(--shadow);
}
.sheet:focus { outline: none; }
.sheet::before { content: ""; align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); flex: none; }
.sheet h2 { font-size: 22px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.sheet p { font-size: 15px; }
.feel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.feel button { background: var(--fill); padding: 12px 6px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; }
.feel button b { font-size: 16px; font-weight: 600; }
.feel button small { font-size: 12px; color: var(--muted); line-height: 1.25; }
.feel button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.date-in { width: 100%; min-height: 46px; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--fill); color: var(--text); font-size: 16px; }
.pick-list > li { border-top: 1px solid var(--line); }
.pick-list > li:first-child { border-top: 0; }
.pick-list button { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 12px 0; }
.pick-list b { display: block; font-size: 16px; font-weight: 500; }
.pick-list small { display: block; font-size: 13px; color: var(--muted); }
.pick-list .plus { color: var(--accent); font-size: 22px; font-weight: 400; }
.splash { flex: 1 0 auto; display: grid; place-items: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .bar > i { transition: none; }
  .btn:active { opacity: 1; }
}

</style>

<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <div id="timer" role="timer">
    <div class="t-row">
      <span class="t-lab" id="t-lab">Rest</span>
      <span class="t-num" id="t-num">0:00</span>
      <button type="button" class="pill-btn" data-act="t-add">+15 s</button>
      <button type="button" class="pill-btn" data-act="t-skip">Skip</button>
    </div>
    <div class="bar"><i id="t-bar"></i></div>
  </div>
  <nav id="tabs" aria-label="Sections" hidden>
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V4"/><path d="M7 4.5l11 3.5-11 4"/><path d="M4 21h6"/></svg>Today</button>
    <button type="button" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/><path d="M15 7h4v4"/></svg>Progress</button>
    <button type="button" data-tab="record"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>Record</button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Plan</button>
  </nav>
  <div id="sheet"></div>
</div>
<script>
/* Exercise library and workout templates.
   Row: [id, name, equipment, minLevel, maxLevel, mode, flags, how, why]
   equipment: '' (bodyweight, golf club, chair, wall) | band | db | mb | bench | gym
   mode: r = reps, s = reps each side, t = timed hold, ts = timed hold each side
   flags: k = loads knees, b = loads lower back, s = loads shoulders, i = impact (jumping) */
const LIB = [];
function addPool(pool, rows) {
  rows.forEach(function (r) {
    LIB.push({ id: r[0], name: r[1], pool: pool, eq: r[2], lo: r[3], hi: r[4], mode: r[5], fl: r[6], how: r[7], why: r[8], idx: LIB.length });
  });
}

/* ---------- Mobility: hips ---------- */
addPool('hip', [
  ['hip9090', '90/90 hip switches', '', 1, 3, 's', 'k', 'Sit with both knees bent to 90°, one shin in front and one out to the side. Stay tall and rotate both knees over to the other side. Lean on your hands if you need to.', 'Hip rotation lets you load your trail hip and clear your lead hip without swaying.'],
  ['wgs', "World's greatest stretch", '', 2, 3, 's', 'k', 'Step into a long lunge with both hands inside the front foot. Drop the inside elbow toward the floor, then rotate that arm to the ceiling. Step back and switch sides.', 'Opens hips, hamstrings and upper back together, the same chain a full turn uses.'],
  ['leg_swings', 'Leg swings', '', 1, 3, 's', '', 'Hold a wall or a club for balance. Swing one leg forward and back, then across your body and out. Stay tall and let the swing grow gradually.', 'Warms the hips through the ranges your backswing and follow-through need.'],
  ['adductor_rock', 'Adductor rock-backs', '', 1, 3, 's', 'k', 'On hands and knees, straighten one leg out to the side with the foot flat. Rock your hips back toward your heel, then return.', 'Inner-thigh mobility supports a wide, stable stance and a clean weight shift.'],
  ['hip_cars', 'Standing hip circles', '', 1, 3, 's', '', 'Hold a wall. Lift one knee to hip height, open it out to the side, turn the foot behind you and lower. Make the biggest slow circle you can control, then reverse.', 'Controlled hip rotation is the engine of the swing, trained here with no floor work.'],
  ['squat_pry', 'Deep squat hold', '', 2, 3, 't', 'k', 'Sink into a deep squat with elbows inside your knees and chest up. Gently press the knees out and shift side to side. Hold a door frame if you need support.', 'Restores the hip and ankle range that keeps your posture through the swing.'],
  ['cossack', 'Cossack shifts', '', 2, 3, 's', 'k', 'Take a wide stance. Sit down over one heel while the other leg stays straight with toes up. Push back to the middle and shift to the other side.', 'Trains side-to-side hip mobility for loading and posting up on each leg.']
]);

/* ---------- Mobility: upper back ---------- */
addPool('tsp', [
  ['open_book', 'Open book', '', 1, 3, 's', '', 'Lie on your side with knees bent and stacked, arms straight in front. Sweep the top arm up and over to the floor behind you and follow it with your eyes. Keep the knees together.', 'Your shoulder turn should come from the upper back, not the lower back.'],
  ['thread_needle', 'Thread the needle', '', 1, 3, 's', '', 'On hands and knees, slide one arm under your body until that shoulder rests near the floor. Then sweep the same arm up to the ceiling.', 'Frees upper-back rotation both ways for a fuller backswing and finish.'],
  ['quad_rot', 'Kneeling upper-back rotation', '', 1, 3, 's', '', 'On hands and knees, sit back slightly and put one hand behind your head. Bring that elbow toward the opposite wrist, then rotate it up to the ceiling.', 'Isolates upper-back turn while your hips stay still, like a good backswing.'],
  ['club_turns', 'Golf-posture turns', '', 1, 3, 's', '', 'Hold a club across your shoulders and set up in golf posture. Turn back until your lead shoulder sits over your trail foot, then turn through to a full finish.', 'Rehearses separating shoulders from hips, where stored power comes from.'],
  ['cat_cow', 'Cat-cow', '', 1, 3, 'r', '', 'On hands and knees, round your whole spine up toward the ceiling, then let your chest sink and tailbone lift. Move slowly, one breath per rep.', 'Gets every segment of the spine moving before you ask it to rotate.'],
  ['seated_rot', 'Seated club rotation', '', 1, 3, 's', '', 'Sit tall on a chair with a club across your chest and feet planted. Rotate your shoulders as far as you can each way without your knees moving.', 'Sitting locks the hips, so the turn has to come from your upper back.']
]);

/* ---------- Mobility: shoulders ---------- */
addPool('shd', [
  ['wall_angels', 'Wall angels', '', 1, 3, 'r', '', 'Stand with back, head and arms against a wall, elbows bent 90°. Slide your arms up overhead and back down, keeping contact with the wall.', 'Opens the chest and shoulders so you can keep width and posture at the top.'],
  ['band_apart', 'Band pull-aparts', 'band', 1, 3, 'r', '', 'Hold a band at chest height with straight arms. Pull it apart until it touches your chest, squeezing your shoulder blades. Return slowly.', 'Wakes up the upper back that holds your posture over the ball.'],
  ['shoulder_cars', 'Slow arm circles', '', 1, 3, 's', '', 'Stand tall. Draw the biggest, slowest circle you can with one straight arm, turning the palm as it passes behind you. Keep your ribs still.', 'Maintains the shoulder rotation you need at the top and through release.'],
  ['pass_through', 'Club pass-throughs', '', 1, 3, 'r', 's', 'Hold a club with a very wide grip and straight arms. Raise it overhead and as far behind you as is comfortable, then bring it back.', 'Loosens the tight shoulders and chest that shorten a backswing.'],
  ['scap_pushup', 'Shoulder-blade push-ups', '', 1, 3, 'r', '', 'On hands and knees or in a plank, keep your elbows straight. Let your chest sink between the shoulder blades, then push the floor away.', 'Stable shoulder blades give your arms a solid base to swing from.']
]);

/* ---------- Activation ---------- */
addPool('act', [
  ['glute_bridge', 'Glute bridge', '', 1, 2, 'r', '', 'Lie on your back, knees bent, feet flat. Squeeze your glutes and lift your hips until shoulders, hips and knees line up. Pause for a second and lower.', 'Glutes are a main power source in the swing and they protect your back.'],
  ['bridge_march', 'Marching bridge', '', 2, 3, 's', '', 'Hold the top of a glute bridge. Lift one foot off the floor without letting your hips drop or twist, set it down and switch.', 'Teaches glutes and core to hold your pelvis steady on one leg.'],
  ['band_walk', 'Lateral band walks', 'band', 1, 3, 's', '', 'Loop a band around your ankles or above the knees. Sink into a quarter squat and step sideways, keeping tension on the band and toes forward.', 'Strengthens the side glutes that stop your hips sliding during the swing.'],
  ['clamshell', 'Clamshells', '', 1, 2, 's', '', 'Lie on your side, knees bent, feet together. Keeping feet touching, lift the top knee without rolling your hips back. Lower slowly.', 'Targets the hip rotators that stabilize your lead leg at impact.'],
  ['hip_abd', 'Standing leg raises', '', 1, 3, 's', '', 'Stand tall holding a wall. Lift one straight leg out to the side without leaning, pause, and lower slowly.', 'Builds side-hip strength for balance on slopes and through your finish.']
]);

/* ---------- Balance ---------- */
addPool('bal', [
  ['sl_stand', 'Single-leg stand', '', 1, 2, 'ts', '', 'Stand near a wall and lift one foot. Hold steady. Too easy? Turn your head side to side or close your eyes.', 'Balance on your lead leg is what lets you finish every swing in control.'],
  ['sl_turns', 'Single-leg golf turns', '', 2, 3, 's', '', 'Stand on your lead leg in golf posture with arms crossed. Turn your shoulders back and through without wobbling. Then switch legs.', 'Combines balance with rotation, which is what your finish position demands.'],
  ['tandem', 'Heel-to-toe walk', '', 1, 2, 'r', '', 'Walk in a straight line, placing each heel directly in front of the other foot. Keep your eyes forward. Walk beside a wall for safety.', 'Sharpens the balance that keeps you steady on uneven lies.'],
  ['clock_reach', 'Single-leg clock reaches', '', 2, 3, 's', 'k', 'Stand on one leg with a soft knee. Reach the free foot forward, out to the side and behind you, tapping lightly each time.', 'Builds ankle, knee and hip control for stable footing through the swing.']
]);

/* ---------- Power: lower body ---------- */
addPool('lpow', [
  ['speed_squat', 'Speed squats', '', 1, 3, 'r', 'k', 'Lower into a squat under control, then drive up as fast as you can, rising onto your toes. Your feet stay on the floor.', 'Teaches you to push hard into the ground, where clubhead speed starts.'],
  ['fast_sts', 'Fast sit-to-stand', '', 1, 2, 'r', '', 'Sit on a sturdy chair with arms crossed. Stand up as fast as you can, then sit back down slowly over three seconds.', 'Leg power fades faster than strength as we age. This trains it with no impact.'],
  ['calf_pop', 'Quick heel raises', '', 1, 3, 'r', '', 'Hold a wall lightly. Rise onto your toes as fast as you can, then lower under control.', 'Ankle power adds to the push off the ground in your downswing.'],
  ['squat_jump', 'Squat jumps', '', 2, 3, 'r', 'kbi', 'Dip into a quarter squat and jump as high as you can. Land softly on the balls of your feet with knees bent, reset, and go again.', 'Jump height is linked to clubhead speed in golfers.'],
  ['lat_bound', 'Lateral bounds', '', 2, 3, 's', 'ki', 'Stand on one leg and leap sideways, landing softly on the other leg. Stick the landing for a second before bounding back.', 'Trains the push from trail side to lead side that drives the downswing.'],
  ['broad_jump', 'Broad jumps', '', 3, 3, 'r', 'kbi', 'Swing your arms back, then jump forward as far as you can. Land softly in a squat and walk back to the start.', 'Builds explosive hip extension for more distance off the tee.'],
  ['box_jump', 'Box jumps', 'bench', 3, 3, 'r', 'ki', 'Jump onto a sturdy box or bench, landing softly with both feet flat. Stand tall, then step down one foot at a time.', 'Develops explosive leg drive with a softer landing than jumping on flat ground.'],
  ['stepup_drive', 'Step-up with knee drive', 'bench', 1, 3, 's', 'k', 'Place one foot on a step. Drive up quickly, lifting the other knee to hip height, then lower slowly on the same leg.', 'Single-leg power with control, like posting up on your lead leg.'],
  ['kb_swing', 'Kettlebell swing', 'db', 2, 3, 'r', 'b', 'Hinge and hike the weight back between your legs, then snap your hips forward so it floats to chest height. Arms stay loose and the hips do the work.', 'Explosive hip extension is a major source of swing speed.'],
  ['mb_slam', 'Medicine ball slams', 'mb', 1, 3, 'r', '', 'Reach a medicine ball overhead, then throw it into the floor in front of you as hard as you can, hinging at the hips. Pick it up and repeat.', 'Builds full-body power and the trunk muscles that pull the club down.']
]);

/* ---------- Power: rotational ---------- */
addPool('rpow', [
  ['speed_swing', 'Speed swings', '', 1, 3, 's', '', 'Flip a club over and grip it near the head. Make full swings as fast as you can, listening for the whoosh after where the ball would be. Then swing the other way round.', 'Swinging something light at full effort teaches your body to move faster.'],
  ['step_swing', 'Step-through swings', '', 2, 3, 'r', '', 'Start with feet together and a club in hand. As you finish the backswing, step toward the target with your lead foot and swing through at full speed.', 'Grooves the ground-up sequence of step, hips, torso, arms.'],
  ['band_rot', 'Fast band rotations', 'band', 1, 3, 's', '', 'Anchor a band at chest height and stand side-on in golf posture, arms straight. Rotate away from the anchor as fast as you can, then return slowly.', 'Trains rotational speed against resistance in your actual golf posture.'],
  ['mb_scoop', 'Rotational ball toss', 'mb', 1, 3, 's', 'b', 'Stand side-on to a solid wall with a medicine ball at your back hip. Drive your hips through and throw the ball into the wall. Catch it or let it drop.', 'The closest gym move to a golf swing. Hips lead, torso and arms follow.'],
  ['mb_shot', 'Rotational shot-put throw', 'mb', 2, 3, 's', 'b', 'Stand side-on to a wall with the ball at your back shoulder. Push off the back leg, rotate and punch the ball into the wall.', 'Builds the trail-side push and rotation that deliver the club.'],
  ['mb_rot_slam', 'Rotational ball slams', 'mb', 2, 3, 's', 'b', 'Lift a medicine ball overhead, pivot and slam it to the floor just outside one foot. Alternate sides.', 'Links upper and lower body through a fast, powerful turn.']
]);

/* ---------- Strength: squat ---------- */
addPool('squat', [
  ['sts', 'Slow sit-to-stand', '', 1, 1, 'r', '', 'From a sturdy chair, stand up without using your hands. Lower for three seconds until you lightly touch the seat, then stand again.', 'Builds the basic leg strength behind a stable base and an easy 18-hole walk.'],
  ['bw_squat', 'Bodyweight squat', '', 1, 2, 'r', 'k', 'Feet shoulder-width, toes slightly out. Sit back and down as far as you can with heels flat and chest up, then stand tall.', 'Strong legs give you a stable base and more force into the ground.'],
  ['goblet', 'Goblet squat', 'db', 1, 3, 'r', 'k', 'Hold one dumbbell upright against your chest. Squat between your knees with elbows inside them and chest tall, then drive up.', 'The front load builds your legs and the upright posture you need over the ball.'],
  ['tempo_squat', 'Tempo squat', '', 2, 3, 'r', 'k', 'Lower into a squat over three seconds, pause for one second at the bottom, then stand up fast.', 'Slow lowering builds strength and control with no equipment.'],
  ['skater_squat', 'Skater squat', '', 3, 3, 's', 'k', 'Stand on one leg with the other bent behind you. Lower until the back knee lightly touches a cushion, reaching your arms forward, then stand.', 'Serious single-leg strength for a powerful, stable lead side.'],
  ['bb_squat', 'Barbell squat', 'gym', 3, 3, 'r', 'kb', 'With the bar on your upper back or front shoulders, brace and squat until your thighs are at least parallel. Drive up through the whole foot.', 'More leg strength raises the ceiling on how fast you can swing.'],
  ['leg_press', 'Leg press', 'gym', 1, 3, 'r', '', 'Set feet shoulder-width on the platform. Lower until your knees reach about 90° without your hips lifting, then press back up without locking out.', 'Builds leg strength with your back fully supported.'],
  ['wall_sit', 'Wall sit', '', 1, 3, 't', '', 'Lean your back against a wall and slide down to a depth you can hold, up to thighs parallel. Keep feet flat and weight in your heels.', 'Builds leg endurance for holding posture late in the round.']
]);

/* ---------- Strength: hinge ---------- */
addPool('hinge', [
  ['club_hinge', 'Hip hinge with club', '', 1, 1, 'r', '', 'Hold a club along your spine so it touches your head, upper back and tailbone. With soft knees, push your hips back until your chest tips forward, keeping all three contacts.', 'The hinge is your golf posture. Owning it protects your lower back.'],
  ['good_morning', 'Bodyweight good morning', '', 1, 2, 'r', '', 'Hands behind your head, knees soft. Push your hips straight back until you feel your hamstrings stretch, then squeeze your glutes to stand.', 'Strengthens the hamstrings and glutes that hold your posture all round.'],
  ['sl_rdl', 'Single-leg Romanian deadlift', '', 2, 3, 's', '', 'Stand on one leg with a soft knee. Hinge forward as the free leg reaches straight back, hips square to the floor. Hold a weight in the opposite hand to progress.', 'Builds hip strength and balance one leg at a time, like the swing itself.'],
  ['elev_bridge', 'Single-leg bridge, foot raised', '', 2, 3, 's', '', 'Lie on your back with one heel on a chair and the other leg in the air. Drive through the heel to lift your hips, pause, and lower slowly.', 'Loads the glutes and hamstrings hard with only your body weight.'],
  ['db_rdl', 'Dumbbell Romanian deadlift', 'db', 1, 3, 'r', 'b', 'Hold dumbbells in front of your thighs. Push your hips back and slide the weights down your legs with a flat back, then drive your hips forward to stand.', 'Strengthens the whole back side of the body that powers your downswing.'],
  ['pull_through', 'Band pull-through', 'band', 1, 3, 'r', '', 'Anchor a band low behind you and hold it between your legs, facing away. Hinge back, then snap your hips forward to stand tall.', 'Grooves powerful hip extension with very little load on your spine.'],
  ['hip_thrust', 'Hip thrust', 'bench', 2, 3, 'r', '', 'Rest your upper back on a bench, feet flat, a weight on your hips if you have one. Drive your hips up until your body is level, pause, and lower.', 'The most direct way to strengthen the glutes for speed.'],
  ['deadlift', 'Deadlift', 'gym', 3, 3, 'r', 'b', 'Use a trap bar or barbell. With a flat back and the weight close, push the floor away and stand tall. Lower under control.', 'Total-body strength that carries straight into force off the ground.']
]);

/* ---------- Strength: single leg ---------- */
addPool('lunge', [
  ['sup_split', 'Supported split squat', '', 1, 1, 's', 'k', 'Stand in a split stance holding a chair. Lower your back knee toward the floor, then push up through the front foot.', 'Builds single-leg strength safely for a steadier stance.'],
  ['rev_lunge', 'Reverse lunge', '', 1, 3, 's', 'k', 'Step one foot back and lower until both knees bend to about 90°. Push through the front foot to return. Hold dumbbells to progress.', 'Single-leg strength for stability on sidehill and downhill lies.'],
  ['lat_lunge', 'Lateral lunge', '', 2, 3, 's', 'k', 'Take a big step to the side and sit back into that hip, keeping the other leg straight and both feet flat. Push back to the start.', 'Strengthens the side-to-side movement behind your weight shift.'],
  ['split_squat', 'Split squat', '', 2, 3, 's', 'k', 'In a long split stance, lower straight down until the back knee nearly touches the floor, then drive up. Hold dumbbells to progress.', 'Builds each leg on its own and evens out side-to-side differences.'],
  ['step_up', 'Step-up', 'bench', 1, 3, 's', 'k', 'Place one foot on a step or bench. Stand up using only that leg, then lower slowly for three seconds.', 'Builds the lead-leg strength you post up on through impact.'],
  ['bulgarian', 'Rear-foot-raised split squat', 'bench', 3, 3, 's', 'k', 'Rest your back foot on a bench. Lower until the front thigh is parallel to the floor, then drive up. Hold dumbbells to progress.', 'High-level single-leg strength and hip mobility in one move.'],
  ['side_leg', 'Side-lying leg raise', '', 1, 2, 's', '', 'Lie on your side with legs straight. Lift the top leg about 45° with toes pointing forward, pause, and lower slowly.', 'Side-hip strength keeps your pelvis level, with no load on the knees.'],
  ['hip_airplane', 'Hip airplanes', '', 2, 3, 's', '', 'Stand on one leg holding a wall and hinge forward with the free leg behind you. Rotate your pelvis open toward the ceiling, then closed toward the floor, turning over the standing hip.', 'Trains loaded hip rotation on one leg, the motion of your lead hip through impact.']
]);

/* ---------- Strength: push ---------- */
addPool('push', [
  ['incline_pu', 'Incline push-up', '', 1, 2, 'r', '', 'Place your hands on a counter or bench with your body in a straight line. Lower your chest to the edge and push back up.', 'Builds pushing strength and a braced trunk at a manageable load.'],
  ['knee_pu', 'Knee push-up', '', 1, 2, 'r', '', 'From your knees with hands under your shoulders, keep a straight line from knees to head. Lower your chest to just above the floor and press up.', 'A step toward full push-ups that still trains your trunk to stay braced.'],
  ['pushup', 'Push-up', '', 2, 3, 'r', '', 'Hands just outside shoulder width, body straight from head to heels. Lower your chest to just above the floor and press up.', 'Upper-body strength plus a braced core, both needed at impact.'],
  ['tempo_pu', 'Tempo push-up', '', 3, 3, 'r', '', 'Lower for three seconds, pause just above the floor, then press up fast. Raise your feet on a step to make it harder.', 'Adds strength and control without needing more weight.'],
  ['floor_press', 'Dumbbell press', 'db', 1, 3, 'r', '', 'Lie on a bench or the floor with a dumbbell in each hand. Press up until your arms are straight, then lower until your upper arms reach chest level or touch the floor.', 'Chest and triceps strength supports width and extension through the ball.'],
  ['hk_press', 'Half-kneeling overhead press', 'db', 2, 3, 's', 's', 'Kneel on one knee and hold a dumbbell at the shoulder on that same side. Press overhead without leaning back, then lower.', 'Builds shoulder strength while your core and hips keep you square.'],
  ['band_press', 'Split-stance band press', 'band', 1, 3, 's', '', 'Anchor a band behind you at chest height and stand in a split stance. Press one hand straight forward without letting your torso twist.', 'Your core has to resist rotation while you push, like holding posture at impact.'],
  ['landmine', 'Landmine press', 'gym', 2, 3, 's', '', 'Stand in a split stance holding the end of a barbell at your shoulder. Press it up and forward, reaching at the top.', 'A shoulder-friendly press that ties your arm to your trunk and hips.']
]);

/* ---------- Strength: pull ---------- */
addPool('pull', [
  ['prone_ytw', 'Prone Y-T-W raises', '', 1, 3, 'r', '', 'Lie face down with your forehead on a towel. Lift your arms into a Y, then a T, then pull your elbows back into a W, squeezing your shoulder blades each time. That is one rep.', 'Strengthens the upper back that keeps you in posture for 18 holes.'],
  ['rev_angel', 'Reverse snow angels', '', 2, 3, 'r', '', 'Lie face down with arms lifted just off the floor. Sweep them in a wide arc from overhead to your hips and back without touching down.', 'Builds shoulder-blade control and upper-back endurance.'],

  let right;
  if (tr) {
    right = '<span class="st' + (done ? ' ok' : '') + '">' + Math.min(it.done, it.rx.sets) + '/' + it.rx.sets + '</span>';
  } else {
    right = '<div class="boxes">';
    for (let k = 0; k < it.rx.sets; k++) {
      right += '<button type="button" class="box' + (k < it.done ? ' on' : '') + '" data-act="set" data-i="' + i + '" data-k="' + k + '" aria-pressed="' + (k < it.done) + '" aria-label="' + esc(ex.name + ', set ' + (k + 1) + ' of ' + it.rx.sets) + '">' + (k < it.done ? ICON_CHECK.replace('<svg', '<svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"') : (k + 1)) + '</button>';
    }
    right += '</div>';
  }
  let h = '<li class="' + (done ? 'done' : '') + '"><div class="item-head"><button type="button" class="item-main" data-act="toggle" data-i="' + i + '" aria-expanded="' + open + '">' +
    '<span class="n">' + n + '</span><span class="nm">' + esc(ex.name) + '<small>' + E.rxLabel(it.rx) + (it.rx.rest ? ' · rest ' + it.rx.rest + ' s' : '') + '</small></span></button>' + right + '</div>';
  if (open) {
    h += '<div class="detail">';
    if (tr) {
      const d = defaults(it);
      if (d.last) {
        h += '<p class="hint">Last time, ' + esc(fmtS(d.last.date)) + ': <b>' + esc(fmtSets(d.last.sets, tr.sec)) + '</b>' +
          (d.sug && d.sug.up ? '. You reached ' + d.sug.top + ' reps on every set, so try <b>' + fmtN(d.sug.w) + ' ' + units() + '</b>.' : '.') + '</p>';
      } else if (tr.w) h += '<p class="hint">First time logging this one. Enter the weight you use, or leave it blank for bodyweight.</p>';
      h += setTable(it, i, d, ex.name);

    if (UI.how === i) {
      h += '<div class="how">' + (ex.how ? '<p><b>How</b>' + esc(ex.how) + '</p>' : '') + (ex.why ? '<p><b>Why it helps your golf</b>' + esc(ex.why) + '</p>' : '') +
        (ex.custom ? '<p>Your own exercise.</p>' : '<p><b>Effort</b>' + esc(E.effort(ex, S.profile)) + '</p>') + '</div>';
    }
    const swappable = !ex.custom && E.candidates(it.pool, S.profile, {}).length > 1;
    h += '<div class="acts">' +
      (ex.custom ? '' : '<button type="button" class="pill-btn" data-act="how" data-i="' + i + '" aria-expanded="' + (UI.how === i) + '">' + (UI.how === i ? 'Hide how-to' : 'How to do it') + '</button>') +
      (it.rx.hold ? '<button type="button" class="pill-btn" data-act="hold" data-i="' + i + '">Start ' + it.rx.hold + ' s timer</button>' : '') +
      '<a class="pill-btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' exercise how to') + '">Demo video ↗</a>' +
      (swappable ? '<button type="button" class="pill-btn" data-act="swap" data-i="' + i + '">Swap</button>' : '') + '</div></div>';
  }
  return h + '</li>';
}
function vSession() {
  const ses = S.session, st = sesStats(ses);

/* ================= summaries and progress ================= */
function filterBar() {
  return '<div class="filters"><div class="chips" role="group" aria-label="Time range">' + RANGES.map(function (r) {
    return '<button type="button" class="chip" data-act="range" data-v="' + r[0] + '" aria-pressed="' + (S.view.range === r[0]) + '">' + r[1] + '</button>';
  }).join('') + '</div><div class="row2">' + seg('metric', [['best', 'Best set'], ['total', 'Session total']], S.view.metric, 'What to chart') +
    '<button type="button" class="pill-btn" data-act="table" aria-pressed="' + S.view.table + '">' + (S.view.table ? 'Show charts' : 'Show table') + '</button></div></div>';
}
/* One exercise: its numbers, how they compare, and its chart. entry: the workout being reviewed, if any. */
function exBlock(id, rg, entry) {
  const sm = seriesMode(id), h = hist()[id] || [];
  const pts = h.filter(function (s) { return s.date >= rg.start && s.date <= rg.end; }).map(function (s) {
    return { date: s.date, id: s.id, v: sessionValue(s.sets, sm.mode), sets: s.sets, cur: !!entry && s.id === entry.id };
  }).filter(function (p) { return p.v != null; });
  const curRec = entry ? h.find(function (s) { return s.id === entry.id; }) : null;
  const curV = curRec ? sessionValue(curRec.sets, sm.mode) : null;
  let out = '<article class="ex-block"><div class="between"><h3 class="h2">' + esc(exName(id)) + '</h3><span class="tiny muted">' + esc(sm.label) + '</span></div>';
  const cmp = [];
  if (curRec) {
    out += '<p class="today">' + esc(fmtSets(curRec.sets, sm.sec)) + '</p>';
    const prior = h.filter(function (s) { return before(s, entry); }).map(function (s) { return { s: s, v: sessionValue(s.sets, sm.mode) }; }).filter(function (p) { return p.v != null; });
    const prev = prior[prior.length - 1];
    if (curV != null && prev) {
      const dv = Math.round((curV - prev.v) * 10) / 10;
      cmp.push(dv === 0 ? 'Same as last time (' + esc(fmtS(prev.s.date)) + ')' : '<b>' + (dv > 0 ? '+' : '−') + esc(fmtVal(Math.abs(dv), sm.unit)) + '</b> vs last time (' + esc(fmtS(prev.s.date)) + ')');
      const top = Math.max.apply(null, prior.map(function (p) { return p.v; }));
      if (curV > top) out = out.replace('</h3>', '<span class="tag">Personal best</span></h3>');
    } else if (curV != null) cmp.push('First time logged');
    const inRange = pts.filter(function (p) { return !p.cur; });
    if (inRange.length) {
      const bestP = inRange.reduce(function (a, p) { return p.v > a.v ? p : a; });
      cmp.push('Best before this in ' + esc(rg.phrase) + ': <b>' + esc(fmtVal(bestP.v, sm.unit)) + '</b>');
    }
  } else if (pts.length) {
    const lastP = pts[pts.length - 1];
    cmp.push('Latest <b>' + esc(fmtVal(lastP.v, sm.unit)) + '</b> on ' + esc(fmtS(lastP.date)));
    if (pts.length > 1) {
      const dv = Math.round((lastP.v - pts[0].v) * 10) / 10;
      cmp.push(dv === 0 ? 'No change in ' + esc(rg.phrase) : '<b>' + (dv > 0 ? '+' : '−') + esc(fmtVal(Math.abs(dv), sm.unit)) + '</b> in ' + esc(rg.phrase));
    }
  }
  if (cmp.length) out += '<p class="cmp">' + cmp.map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</p>';
  const o = { unit: sm.unit, sec: sm.sec, start: rg.start, end: rg.end, label: exName(id) + ', ' + sm.label.toLowerCase() };
  if (!pts.length) out += '<p class="note">No sessions with numbers in ' + esc(rg.phrase) + '.</p>';
  else if (S.view.table) out += tableOf(pts, o, sm.label);
  else if (pts.length === 1) out += '<p class="note">' + (curRec && h.length === 1 ? 'The chart starts once you have logged this exercise twice.' : 'Only one session in ' + esc(rg.phrase) + '. Choose a longer range to compare.') + '</p>';
  else out += lineChart(pts, o);
  return out + '</article>';
}
function volumeSection(rg, entry) {
  const pts = S.log.filter(function (e) { return e.p && e.date >= rg.start && e.date <= rg.end; }).map(function (e) {
    return { date: e.date, v: entryVolume(e), cur: !!entry && e.id === entry.id, name: entryName(e) };
  }).filter(function (p) { return p.v > 0; });
  if (!pts.length) return '';
  const o = { unit: units(), start: rg.start, end: rg.end, label: 'Volume per workout, weight times reps', bars: true, emph: !!entry };
  return '<section class="stack"><div class="between"><h2 class="h2">Volume per workout</h2><span class="tiny muted">' + units() + ' × reps</span></div>' +
    (S.view.table ? tableOf(pts, o, 'Volume') : barChart(pts, o)) + '</section>';
}
function vSummary() {
  const e = S.log.find(function (x) { return x.id === UI.sum.id; });
  const name = entryName(e), u = units(), rg = rangeOf(e.date);
  const rec = entrySets(e), vol = entryVolume(e);
  const nSets = rec.reduce(function (a, r) { return a + r.sets.length; }, 0);
  const prevSame = S.log.filter(function (x) { return sameWorkout(x, e) && before(x, e); }).pop();
  const pv = prevSame ? entryVolume(prevSame) : 0;
  const meta = [fmt(e.date, { weekday: 'long', month: 'short', day: 'numeric' })];
  if (e.feel) meta.push('Felt ' + FEEL[e.feel].toLowerCase());
  let html = '<div class="between"><span class="date">' + (UI.sum.fresh ? 'Workout logged' : 'Workout summary') + '</span>' +
    '<button class="link" data-act="sum-done">' + (UI.sum.back === 'record' ? 'Back' : 'Done') + '</button></div>' +
    '<div class="stack tight"><h1 class="title">' + esc(name) + '</h1><p class="small muted">' + esc(meta.join(' · ')) + '</p></div>' +
    '<dl class="tiles"><div class="tile"><dt>Time</dt><dd>' + (e.min ? e.min + '<small>min</small>' : '–') + '</dd></div>' +
    '<div class="tile"><dt>' + (nSets ? 'Sets logged' : 'Exercises') + '</dt><dd>' + (nSets || e.ex.length) + '</dd></div>' +
    '<div class="tile"><dt>Volume</dt><dd>' + (vol ? fmtK(vol) + '<small>' + u + '</small>' : '–') + '</dd>' +
    (vol && pv ? '<span class="delta">' + (vol >= pv ? '+' : '−') + Math.abs(Math.round((vol - pv) / pv * 100)) + '% vs ' + esc(fmtS(prevSame.date)) + '</span>' : '') + '</div></dl>';
  if (UI.sum.fresh) {
    const nx = nextUp(D.today());
    html += '<p class="small">Next up: <strong>' + esc(nx.name) + '</strong>, due ' + esc(rel(nx.due)) + '.</p>';
  }
  if (rec.length) {
    html += filterBar() + volumeSection(rg, e) +
      '<section class="stack" style="gap:22px"><h2 class="h2">Exercises</h2>' + rec.map(function (r) { return exBlock(r.id, rg, e); }).join('') + '</section>';
  } else {
    html += '<p class="prose">No weights or reps were logged in this workout, so there is nothing to chart. Next time, tap an exercise during the workout to log each set.</p>';
  }
  const others = e.ex.filter(function (id, i) { return !(e.p && e.p[i]); }).filter(function (id, i, a) { return a.indexOf(id) === i; });
  if (others.length && rec.length) html += '<p class="tiny muted">Also done: ' + esc(others.map(exName).join(', ')) + '.</p>';
  html += '<button class="btn primary" data-act="sum-done">' + (UI.sum.back === 'record' ? 'Back to record' : 'Done') + '</button>';
  return html;
}
function vProgress() {
  const today = D.today(), rg = rangeOf(today), h = hist();
  const ids = Object.keys(h).map(function (id) {
    const inR = h[id].filter(function (s) { return s.date >= rg.start; });
    return { id: id, last: inR.length ? inR[inR.length - 1] : null };
  }).filter(function (x) { return x.last; }).sort(function (a, b) { return a.last.date < b.last.date ? 1 : a.last.date > b.last.date ? -1 : b.last.id - a.last.id; });
  let html = '<header class="stack tight"><h1 class="title">Progress</h1><p class="small muted">Weight and reps you logged, by exercise.</p></header>';
  if (!Object.keys(h).length) {
    return html + '<p class="prose">Nothing logged yet. During a workout, tap an exercise and log the weight and reps for each set. Your charts show up here, and a summary appears when you finish.</p>';
  }
  html += filterBar() + volumeSection(rg, null);
  html += '<section class="stack" style="gap:22px"><h2 class="h2">Exercises</h2>' +
    (ids.length ? ids.map(function (x) { return exBlock(x.id, rg, null); }).join('') : '<p class="note">No exercises logged in ' + esc(rg.phrase) + '. Try a longer range.</p>') + '</section>';
  return html;
}

/* ================= Record ================= */
function entryRow(e) {
  const open = UI.entryOpen === e.id;
  const meta = [fmt(e.date)];
  if (e.min) meta.push(e.min + ' min');
  if (e.feel) meta.push('Felt ' + FEEL[e.feel].toLowerCase());
  let html = '<li><button type="button" class="entry-main" data-act="entry" data-id="' + e.id + '" aria-expanded="' + open + '">' +
    '<span><b>' + esc(entryName(e)) + '</b><small>' + esc(meta.join(' · ')) + '</small></span><span class="chev" aria-hidden="true">' + (open ? '−' : '+') + '</span></button>';
  if (open) {
    const rec = entrySets(e), armed = UI.armed === 'del' + e.id;
    const others = e.ex.filter(function (id, i) { return !(e.p && e.p[i]); }).filter(function (id, i, a) { return a.indexOf(id) === i; });
    html += '<div class="entry-detail">' +
      (rec.length ? '<ul class="perf-list">' + rec.map(function (r) { const ex = exOf(r.id); return '<li><span>' + esc(exName(r.id)) + '</span><span>' + esc(fmtSets(r.sets, !!ex && (ex.mode === 't' || ex.mode === 'ts'))) + '</span></li>'; }).join('') + '</ul>' : '') +
      (others.length ? '<p class="muted">' + (rec.length ? 'Also: ' : '') + esc(others.map(exName).join(', ')) + '</p>' : '') +
      '<div class="btn-row"><button type="button" class="btn secondary small" data-act="sum-open" data-id="' + e.id + '">View summary</button>' +
      '<button type="button" class="btn danger small" data-act="del" data-id="' + e.id + '">' + (armed ? 'Tap again to delete' : 'Delete') + '</button></div></div>';
  }
  return html + '</li>';
}
function vRecord() {
  const P = S.profile, today = D.today(), cur0 = today.slice(0, 7), nx = nextUp(today);
  const month = UI.month || cur0, y = +month.slice(0, 4), m = +month.slice(5, 7);
  const first = new Date(y, m - 1, 1, 12), lead = first.getDay(), dim = new Date(y, m, 0).getDate();
  const byDate = {};
  S.log.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (d) { return '<div class="dow" aria-hidden="true">' + d + '</div>'; }).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="day out"></div>';
  for (let d = 1; d <= dim; d++) {
    const iso = month + '-' + (d < 10 ? '0' : '') + d, es = byDate[iso] || [];
    const cls = 'day' + (iso === today ? ' today' : '') + (iso === UI.daySel ? ' sel' : '');
    if (es.length) {
      cells += '<button type="button" class="' + cls + '" data-act="day" data-d="' + iso + '" aria-label="' + esc(fmt(iso) + ': ' + es.map(entryName).join(', ')) + '"><span class="nn">' + d + '</span><i class="dot on"></i></button>';
    } else if (iso === nx.due && iso >= today) {

    } else cells += '<div class="' + cls + '"><span class="nn">' + d + '</span><i class="dot blank"></i></div>';
  }
  const inMonth = S.log.filter(function (e) { return e.date.slice(0, 7) === month; }).reverse();

  return '<header class="stack tight"><h1 class="title">Record</h1><p class="small muted">' + (S.log.length ? 'Since ' + esc(fmt(S.log[0].date, { month: 'short', day: 'numeric', year: 'numeric' })) : 'No workouts yet') + '</p></header>' +
    '<dl class="tiles"><div class="tile"><dt>This week</dt><dd>' + E.weekCount(S.log, D.weekStart(today)) + '<small>of ' + P.days + '</small></dd></div>' +

    '<p class="small">Next workout: <strong>' + esc(nx.name) + '</strong>, due ' + esc(rel(nx.due)) + '.</p>' +
    '<section class="stack"><div class="cal-nav"><h2 class="h2">' + esc(first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })) + '</h2><div>' +
    '<button type="button" data-act="month" data-d="-1" aria-label="Previous month">‹</button><button type="button" data-act="month" data-d="1" aria-label="Next month"' + (month >= cur0 ? ' disabled' : '') + '>›</button></div></div>' +
    '<div class="cal">' + cells + '</div><p class="tiny muted"><i class="dot on" style="display:inline-block;width:7px;height:7px;margin-right:6px"></i>Trained   <i class="dot due" style="display:inline-block;width:8px;height:8px;margin:0 6px 0 10px"></i>Next workout due</p></section>' +
    '<section><div class="between"><h2 class="h2">' + (UI.daySel ? esc(fmt(UI.daySel)) : 'Sessions') + '</h2>' + (UI.daySel ? '<button class="link" data-act="day" data-d="">Whole month</button>' : '<span class="tiny muted">' + inMonth.length + ' this month</span>') + '</div>' +
    (shown.length ? '<ul class="rows">' + shown.map(entryRow).join('') + '</ul>' : '<p class="empty" style="padding-top:8px">' + (S.log.length ? 'Nothing logged this month.' : 'Finish your first workout and it shows up here, on the day you did it.') + '</p>') + '</section>';
